<!DOCTYPE html>
<html>
<head>
  <title>My AI</title>
</head>
<body>
<link rel="stylesheet" href="style.css">
<h2>Chat AI</h2>

<input id="userInput" placeholder="پیام بنویس..." />
<button onclick="send()">ارسال</button>

<p id="response"></p>

<script>
async function send() {
  const input = document.getElementById("userInput").value;

  const res = await fetch("https://your-app.up.railway.app/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer 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"
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: [
        { role: "user", content: input }
      ]
    })
  });

  const data = await res.json();
  document.getElementById("response").innerText =
    data.choices[0].message.content;
}
</script>
<script src="AI.js"></script>

</body>
</html>
