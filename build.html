<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نابغه‌کد · نسخه موبایل</title>

    <!-- ===== Font Awesome ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- ===== html2canvas برای اسکرین‌شات ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #02030a; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none;
        }

        .phone {
            width: 393px; height: 852px; border-radius: 48px; background: #0d1117;
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.25); overflow: hidden; touch-action: pan-y;
            position: relative; border: 1px solid rgba(255, 255, 255, 0.04); flex-shrink: 0;
        }

        /* ===== کانتینر اسلاید ===== */
        .container {
            display: flex;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            padding-top: 0;
            direction: ltr;
        }

        .page {
            min-width: 100%; padding: 8px 12px 12px; color: #e8edf5;
            box-sizing: border-box; display: flex; flex-direction: column; height: 100%; overflow: hidden; direction: rtl;
        }

        .page-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-shrink: 0;
        }

        .page-header h2 { font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: #d4dcec; }
        .page-header h2 i { color: #8b5cf6; font-size: 16px; }

        .page-actions { display: flex; gap: 4px; }
        .page-actions button {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); color: #8aa3c9;
            width: 28px; height: 28px; border-radius: 10px; font-size: 12px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .page-actions button:hover { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border-color: rgba(139, 92, 246, 0.2); }
        .page-actions button:active { transform: scale(0.92); }

        /* ===== TABS ===== */
        .tabs {
            display: flex; gap: 4px; margin-bottom: 6px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.02); padding: 3px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .tabs button {
            flex: 1; background: transparent; color: #6a7a9a; border: none; padding: 5px 0;
            border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.25s;
        }
        .tabs button i { margin-left: 4px; font-size: 11px; }
        .tabs .active { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25); }

        /* ===== EDITOR ===== */
        .editor-wrapper {
            flex: 1 1 auto; min-height: 0; border-radius: 14px 14px 0 0; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05); background: #0a0e14; position: relative; width: 100%;
        }

        .prism-container {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; flex-direction: row; background: #0d1117; direction: ltr !important;
        }

        #lineNumbers {
            width: 40px; height: 100%; background: #0d1117; border-right: 1px solid #262a33;
            padding: 10px 5px; color: #858585; text-align: right; font-family: 'Droid Sans Mono', monospace;
            font-size: 14px; line-height: 1.5; overflow: hidden; user-select: none; pointer-events: none; flex-shrink: 0;
            overflow-y: auto;
        }

        .editor-layers {
            flex: 1; height: 100%; width: 100%; position: relative; overflow: hidden;
        }

        #codeEditor {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 10px 12px; margin: 0; border: none; outline: none; resize: none;
            font-family: 'Droid Sans Mono', monospace; font-size: 14px; line-height: 1.5;
            background: #0d1117; color: #d4d4d4; caret-color: #ffffff; z-index: 2;
            overflow: auto; white-space: pre-wrap; word-wrap: break-word;
            text-align: left !important;
        }

        #codeEditor::-webkit-scrollbar, #lineNumbers::-webkit-scrollbar { width: 5px; background: transparent; }
        #codeEditor::-webkit-scrollbar-thumb, #lineNumbers::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* ===== PREVIEW ===== */
        .preview-wrapper {
            flex: 1 1 auto; min-height: 0; border-radius: 14px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05); background: #0a0e14; position: relative; width: 100%; height: 100%;
        }

        /* کلاس‌های تغییر سایز دستگاه */
        .preview-wrapper.device-mobile iframe { max-width: 375px; margin: 0 auto; display: block; }
        .preview-wrapper.device-tablet iframe { max-width: 768px; margin: 0 auto; display: block; }
        .preview-wrapper.device-desktop iframe { max-width: 100%; margin: 0; display: block; }

        .preview-wrapper iframe {
            width: 100%; height: 100%; border: none; background: #ffffff;
            position: absolute; top: 0; left: 0; transition: all 0.3s ease;
        }

        /* حالت تمام صفحه */
        .preview-wrapper iframe.fullscreen-active {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999;
            background: #ffffff; border-radius: 0;
        }

        /* ===== AI CHAT ===== */
        .chat-container { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
        .chat-messages {
            flex: 1; background: rgba(255, 255, 255, 0.02); border-radius: 14px; padding: 10px; overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.04); display: flex; flex-direction: column; gap: 6px; min-height: 80px;
        }
        .chat-messages .msg { padding: 8px 12px; border-radius: 14px; max-width: 85%; font-size: 13px; line-height: 1.5; animation: fadeIn 0.3s ease; }
        .chat-messages .msg.user { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-messages .msg.bot { background: rgba(255, 255, 255, 0.06); color: #c8d8ec; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .chat-messages .msg i { margin-left: 6px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ===== SUGGESTION BUTTONS ===== */
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; margin-bottom: 6px;
        }
        .suggestions button {
            background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.2);
            color: #c4b5fd; padding: 4px 12px; border-radius: 12px; font-size: 11px; cursor: pointer;
            transition: 0.2s; font-weight: 500;
        }
        .suggestions button:hover { background: rgba(139, 92, 246, 0.25); transform: scale(0.95); }

        .chat-input-row { display: flex; gap: 6px; flex-shrink: 0; }
        .chat-input-row input {
            flex: 1; padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04); color: #e8edf5; font-size: 13px; outline: none; transition: 0.2s;
        }
        .chat-input-row input:focus { border-color: rgba(124, 58, 237, 0.3); background: rgba(255, 255, 255, 0.06); }
        .chat-input-row input::placeholder { color: #4a5a7a; }
        .chat-input-row button { padding: 10px 16px; border-radius: 14px; border: none; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .chat-input-row button:hover { transform: scale(0.96); }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: none; align-self: flex-start; padding: 8px 12px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.04);
            gap: 4px; margin-bottom: 4px;
        }
        .typing-indicator span {
            width: 6px; height: 6px; border-radius: 50%; background: #8b5cf6;
            animation: typing 1.2s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .nav-dots { display: flex; justify-content: center; gap: 8px; padding: 8px 0 4px; flex-shrink: 0; }
        .nav-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); transition: 0.3s; cursor: pointer; }
        .nav-dots span.active { background: #8b5cf6; width: 24px; border-radius: 4px; box-shadow: 0 0 16px rgba(139, 92, 246, 0.2); }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

        .toast-mobile {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #1a1a2e; color: #e8edf5; padding: 12px 24px; border-radius: 16px; font-size: 14px; font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); z-index: 9999;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; backdrop-filter: blur(16px); pointer-events: none;
        }
        .toast-mobile.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== BOTTOM BAR ===== */
        .editor-bottom-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #181a20; padding: 6px 10px; border: 1px solid rgba(255, 255, 255, 0.05); border-top: none;
            flex-shrink: 0; width: 100%; min-height: 40px; border-radius: 0 0 14px 14px;
        }
        .editor-bottom-bar button {
            background: transparent; border: none; color: #8899bb; font-size: 15px; padding: 4px 6px;
            cursor: pointer; border-radius: 6px; transition: all 0.2s ease; min-width: 28px;
        }

        @media (max-width: 420px) {
            .phone { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; border: none; }
            .container { padding-top: 0; }
            .editor-bottom-bar { padding: 4px 6px; min-height: 32px; border-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="phone" id="phone">
        <div class="container" id="container">

            <!-- PAGE 0: AI -->
            <div class="page">
                <div class="page-header">
                    <h2><i class="fas fa-robot"></i> دستیار هوشمند</h2>
                    <div class="page-actions">
                        <button onclick="clearChat()" title="پاک کردن چت"><i class="fas fa-trash-alt"></i></button>
                        <button onclick="exportChat()" title="خروجی چت"><i class="fas fa-download"></i></button>
                    </div>
                </div>
                <div class="chat-container">
                    <div class="suggestions" id="suggestions">
                        <button onclick="quickSend('سلام')">👋 سلام</button>
                        <button onclick="quickSend('چطوری میتونم یه سایت بسازم؟')">🌐 ساخت سایت</button>
                        <button onclick="quickSend('خطای کدم رو چطور حل کنم؟')">🐞 رفع خطا</button>
                        <button onclick="quickSend('ماشین حساب بنویس')">🧮 ماشین حساب</button>
                        <button onclick="quickSend('تشکر')">🙏 تشکر</button>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="msg bot"><i class="fas fa-robot"></i> سلام! من نابغه‌کد هستم. 🤖<br>هر سوالی درباره برنامه‌نویسی داری، بپرس!</div>
                    </div>
                    <div class="typing-indicator" id="typingIndicator">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="aiInput" placeholder="سوال خود را بپرسید..." onkeydown="if(event.key==='Enter') sendAI()">
                        <button onclick="sendAI()"><i class="fas fa-paper-plane"></i> ارسال</button>
                    </div>
                </div>
            </div>

            <!-- PAGE 1: EDITOR -->
            <div class="page">
                <div class="page-header">
                    <h2><i class="fas fa-code"></i> ویرایشگر</h2>
                    <div class="page-actions">
                        <button onclick="runCode()" title="اجرا"><i class="fas fa-play"></i></button>
                        <button onclick="formatCode()" title="زیبا‌سازی"><i class="fas fa-wand-magic-sparkles"></i></button>
                    </div>
                </div>
                <div class="tabs" id="tabs">
                    <button class="active" data-lang="html" onclick="setLang('html',this)"><i class="fab fa-html5"></i> HTML</button>
                    <button data-lang="css" onclick="setLang('css',this)"><i class="fab fa-css3-alt"></i> CSS</button>
                    <button data-lang="javascript" onclick="setLang('javascript',this)"><i class="fab fa-js"></i> JS</button>
                </div>
                <div class="editor-wrapper" id="editorWrapper">
                    <div class="prism-container">
                        <div id="lineNumbers">1</div>
                        <div class="editor-layers">
                            <textarea id="codeEditor" spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>
                
                <div class="editor-bottom-bar">
                    <button onclick="closeEditor()" title="بستن"><i class="fas fa-times"></i></button>
                    <button onclick="runCode()" title="اجرا"><i class="fas fa-play"></i></button>
                    <button onclick="saveFile()" title="ذخیره"><i class="fas fa-save"></i></button>
                    <button onclick="nextTab()" title="تب بعدی"><i class="fas fa-arrow-right"></i></button>
                    <button onclick="prevTab()" title="تب قبلی"><i class="fas fa-arrow-left"></i></button>
                    <button onclick="findInEditor()" title="جستجو"><i class="fas fa-search"></i></button>
                    <button onclick="undoAction()" title="بازگشت"><i class="fas fa-rotate-left"></i></button>
                    <button onclick="redoAction()" title="رفتن به جلو"><i class="fas fa-rotate-right"></i></button>
                    <button onclick="copyContent()" title="کپی"><i class="fas fa-copy"></i></button>
                    <!-- ===== دکمه جدید: ثبت تمرین ===== -->
                    <button id="submitExerciseBtn" onclick="submitExercise()" title="ثبت تمرین" style="display:none;">
                        <i class="fas fa-check-circle"></i> ثبت تمرین
                    </button>
                    <!-- ===== دکمه دریافت پروژه ===== -->
                    <button onclick="goToDone()" title="دریافت پروژه"><i class="fas fa-download"></i></button>
                </div>
            </div>

            <!-- PAGE 2: PREVIEW -->
            <div class="page">
                <div class="page-header">
                    <h2><i class="fas fa-eye"></i> پیش‌نمایش</h2>
                    <div class="page-actions">
                        <button onclick="refreshPreview()" title="بروزرسانی"><i class="fas fa-sync-alt"></i></button>
                        <button onclick="toggleDeviceSize()" title="تغییر سایز نمایش"><i class="fas fa-mobile-alt"></i></button>
                        <button onclick="toggleFullscreenPreview()" title="تمام صفحه"><i class="fas fa-expand"></i></button>
                        <button onclick="takeScreenshot()" title="اسکرین‌شات"><i class="fas fa-camera"></i></button>
                    </div>
                </div>
                <div class="preview-wrapper" id="previewWrapper">
                    <iframe id="frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                </div>
            </div>

        </div>

        <div class="nav-dots" id="navDots">
            <span data-page="0" class="active" onclick="goTo(0)"></span>
            <span data-page="1" onclick="goTo(1)"></span>
            <span data-page="2" onclick="goTo(2)"></span>
        </div>
    </div>

    <div class="toast-mobile" id="toastMobile"></div>

    <script>
        (function() {
            'use strict';

            const container = document.getElementById('container');
            const phone = document.getElementById('phone');
            const dots = document.querySelectorAll('.nav-dots span');
            const frame = document.getElementById('frame');
            const chatMessages = document.getElementById('chatMessages');
            const aiInput = document.getElementById('aiInput');
            const toastEl = document.getElementById('toastMobile');
            const codeEditor = document.getElementById('codeEditor');
            const lineNumbers = document.getElementById('lineNumbers');
            const typingIndicator = document.getElementById('typingIndicator');

            let currentPage = 0;
            const totalPages = 3;
            let currentLang = 'html';
            let previewMode = 'mobile';

            const tabKeys = ['html', 'css', 'javascript'];

            // ===== حافظه مکالمه =====
            let chatHistory = [];

            // ===== فایل‌ها =====
            const files = {
                html: `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمونه HTML</title>
</head>
<body>
    <h1 style="color: #8b5cf6; text-align: center; margin-top: 30px;">🚀 سلام نابغه‌کد!</h1>
    <p style="text-align: center; color: #fff; font-family: sans-serif;">این یک صفحه HTML هست که توی مرورگر اجرا میشه.</p>
    <button onclick="alert('سلام دوست من!')" style="display:block; margin: 20px auto; padding: 10px 20px; background: #8b5cf6; color: white; border: none; border-radius: 8px;">کلیک کن</button>
</body>
</html>`,
                css: `body {
    background: #1a1a2e;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
}`,
                javascript: `console.log("نابغه‌کد آماده است!");
alert("این یک تست از بخش JS هست!");`
            };

            function saveToLocal() {
                try { localStorage.setItem('noboghe-mobile-files', JSON.stringify(files)); } catch (e) {}
            }

            function loadFromLocal() {
                try {
                    const data = localStorage.getItem('noboghe-mobile-files');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (typeof parsed.html === 'string') files.html = parsed.html;
                        if (typeof parsed.css === 'string') files.css = parsed.css;
                        if (typeof parsed.javascript === 'string') files.javascript = parsed.javascript;
                    }
                } catch (e) {
                    console.warn('خطا در بارگذاری از localStorage، استفاده از مقادیر پیش‌فرض');
                }
            }

            function showToast(msg, isError = false) {
                toastEl.textContent = msg;
                toastEl.style.background = isError ? '#7f1d1d' : '#1a1a2e';
                toastEl.style.borderColor = isError ? '#991b1b' : 'rgba(255,255,255,0.06)';
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                setTimeout(() => { toastEl.classList.remove('show'); }, 2400);
            }

            let toastTimer = null;

            function getPhoneWidth() { return phone.clientWidth || 393; }

            window.goTo = function(page) {
                if (page < 0 || page >= totalPages) return;
                currentPage = page;
                const w = getPhoneWidth();
                container.style.transform = `translateX(-${page * w}px)`;
                dots.forEach((dot, i) => { dot.classList.toggle('active', i === page); });
            };

            // SWIPE
            let startX = 0, currentX = 0, isDragging = false;
            phone.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; currentX = startX; isDragging = true; }, { passive: true });
            phone.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                const w = getPhoneWidth();
                const baseOffset = -currentPage * w;
                container.style.transition = 'none';
                container.style.transform = `translateX(${baseOffset + diff}px)`;
            }, { passive: true });
            phone.addEventListener('touchend', function() {
                if (!isDragging) return;
                isDragging = false;
                const diff = currentX - startX;
                container.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
                if (diff < -50 && currentPage < totalPages - 1) goTo(currentPage + 1);
                else if (diff > 50 && currentPage > 0) goTo(currentPage - 1);
                else goTo(currentPage);
            }, { passive: true });

            // ===== ویرایشگر =====
            function updateLineNumbers() {
                const lines = codeEditor.value.split('\n').length;
                let numbers = '';
                for(let i=1; i<=lines; i++) numbers += i + '\n';
                lineNumbers.innerText = numbers;
                lineNumbers.scrollTop = codeEditor.scrollTop;
            }

            codeEditor.addEventListener('input', () => {
                files[currentLang] = codeEditor.value;
                saveToLocal();
                updateLineNumbers();
            });

            codeEditor.addEventListener('scroll', () => {
                lineNumbers.scrollTop = codeEditor.scrollTop;
            });

            // ===== تغییر زبان =====
            window.setLang = function(lang, btn) {
                files[currentLang] = codeEditor.value; 
                currentLang = lang;
                document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');
                const content = files[lang] || '';
                codeEditor.value = content;
                updateLineNumbers();
                codeEditor.scrollTop = 0; 
                showToast(`🔀 تغییر به ${lang.toUpperCase()}`);
            };

            // ===== زیبا سازی کد =====
            window.formatCode = function() {
                let text = codeEditor.value;
                try {
                    const lines = text.split('\n');
                    let indent = 0;
                    const formatted = [];
                    for (let line of lines) {
                        let trimmed = line.trim();
                        if (trimmed === '') { formatted.push(''); continue; }
                        if (trimmed.startsWith('}') || trimmed.startsWith(']') || trimmed.startsWith(')')) indent = Math.max(0, indent - 1);
                        formatted.push('    '.repeat(indent) + trimmed);
                        if (trimmed.endsWith('{') || trimmed.endsWith('[') || trimmed.endsWith('(') || trimmed.endsWith('=>')) indent++;
                    }
                    const newText = formatted.join('\n');
                    if (newText !== text) {
                        codeEditor.value = newText;
                        files[currentLang] = newText;
                        updateLineNumbers();
                        showToast('✨ کد زیبا شد!');
                    } else showToast('ℹ️ کد در حال حاضر زیبا است');
                } catch (e) { showToast('⚠️ خطا در زیبا‌سازی', true); }
            };

            // ===== UNDO/REDO =====
            window.undoAction = function() { document.execCommand('undo'); }
            window.redoAction = function() { document.execCommand('redo'); }
            window.findInEditor = function() { showToast('🔍 جستجو در موبایل با Ctrl+F'); }

            window.copyContent = function() {
                const text = codeEditor.value;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => showToast('📄 کد کپی شد!'));
                } else showToast('⚠️ کپی در این مرورگر پشتیبانی نمی‌شود', true);
            };

            window.closeEditor = function() {
                if (confirm('آیا مطمئن هستید که می‌خواهید محتوای فعلی را پاک کنید؟')) {
                    codeEditor.value = '';
                    files[currentLang] = '';
                    updateLineNumbers();
                    saveToLocal();
                    showToast('🗑️ محتوا پاک شد');
                }
            };

            window.saveFile = function() { saveToLocal(); showToast('💾 فایل ذخیره شد!'); };

            window.nextTab = function() {
                const currentIndex = tabKeys.indexOf(currentLang);
                const nextIndex = (currentIndex + 1) % tabKeys.length;
                const nextLang = tabKeys[nextIndex];
                const btn = document.querySelector(`.tabs button[data-lang="${nextLang}"]`);
                if (btn) setLang(nextLang, btn);
            };
            
            window.prevTab = function() {
                const currentIndex = tabKeys.indexOf(currentLang);
                const prevIndex = (currentIndex - 1 + tabKeys.length) % tabKeys.length;
                const prevLang = tabKeys[prevIndex];
                const btn = document.querySelector(`.tabs button[data-lang="${prevLang}"]`);
                if (btn) setLang(prevLang, btn);
            };

            // ===== PREVIEW =====
            function autoPreview() {
                const html = files.html || '';
                const css = files.css || '';
                const js = files.javascript || '';

                const viewport = previewMode === 'mobile' ? 
                    '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">' :
                    '<meta name="viewport" content="width=device-width, initial-scale=1.0">';
                const styleWrapper = previewMode === 'mobile' ? 
                    `<style>html,body{width:100%;min-height:100vh;margin:0;padding:0;overflow-x:hidden;}</style>` : '';

                const src = `<!DOCTYPE html><html><head><meta charset="UTF-8">${viewport}${styleWrapper}<style>${css}</style></head><body>${html}</body><script>${js}<\/script></html>`;
                frame.srcdoc = src;
            }

            window.runCode = autoPreview;
            window.refreshPreview = autoPreview;

            // ===== تغییر سایز دستگاه =====
            let currentDevice = 0;
            const devices = ['mobile', 'tablet', 'desktop'];
            const deviceLabels = ['📱 موبایل', '📟 تبلت', '🖥️ دسکتاپ'];

            window.toggleDeviceSize = function() {
                const wrapper = document.getElementById('previewWrapper');
                wrapper.classList.remove('device-mobile', 'device-tablet', 'device-desktop');
                frame.style.maxWidth = '';

                currentDevice = (currentDevice + 1) % devices.length;
                const device = devices[currentDevice];

                if (device === 'mobile') {
                    wrapper.classList.add('device-mobile');
                    frame.style.maxWidth = '375px';
                } else if (device === 'tablet') {
                    wrapper.classList.add('device-tablet');
                    frame.style.maxWidth = '768px';
                } else {
                    wrapper.classList.add('device-desktop');
                    frame.style.maxWidth = '100%';
                }

                showToast(`📱 ${deviceLabels[currentDevice]}`);
            };

            // ===== تمام صفحه =====
            window.toggleFullscreenPreview = function() {
                if (frame.classList.contains('fullscreen-active')) {
                    frame.classList.remove('fullscreen-active');
                    frame.style.position = 'absolute';
                    frame.style.width = '100%';
                    frame.style.height = '100%';
                    frame.style.top = '0';
                    frame.style.left = '0';
                    frame.style.zIndex = '';
                    showToast('🔽 خروج از تمام صفحه');
                } else {
                    frame.classList.add('fullscreen-active');
                    frame.style.position = 'fixed';
                    frame.style.top = '0';
                    frame.style.left = '0';
                    frame.style.width = '100vw';
                    frame.style.height = '100vh';
                    frame.style.zIndex = '9999';
                    showToast('🔍 تمام صفحه');
                }
            };

            // ===== اسکرین‌شات =====
            window.takeScreenshot = function() {
                const frame = document.getElementById('frame');
                if (!frame || !frame.contentDocument || !frame.contentDocument.body) {
                    showToast('⚠️ ابتدا پیش‌نمایش را اجرا کنید');
                    return;
                }

                html2canvas(frame.contentDocument.body).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'preview-screenshot.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('📸 اسکرین‌شات گرفته شد!');
                }).catch(() => {
                    showToast('⚠️ خطا در گرفتن اسکرین‌شات');
                });
            };

            // ==========================================================
            // 🧠 AI CHAT (نسخه هوشمند با پاسخ‌های آماده)
            // ==========================================================

            // ===== دیکشنری پاسخ‌های هوشمند =====
            function getAIResponse(message) {
                const msg = message.toLowerCase().trim();

                // --- سلام و احوالپرسی ---
                if (msg.includes('سلام') || msg.includes('درود') || msg.includes('hi') || msg.includes('hello')) {
                    return 'سلام! 👋 چطور می‌تونم کمکت کنم؟';
                }
                if (msg.includes('چطوری') || msg.includes('حالت') || msg.includes('چطور') && msg.includes('شما')) {
                    return 'من خوبم، ممنون! 🤖 چطور می‌تونم بهت کمک کنم؟';
                }
                if (msg.includes('خوبی') || msg.includes('حال')) {
                    return 'عالی! ممنون از لطفت 😊 چیز خاصی برای کمک دارم؟';
                }
                if (msg.includes('تشکر') || msg.includes('ممنون') || msg.includes('مرسی')) {
                    return 'قابل شما رو نداره! 😄 هر وقت سوالی داشتی، بپرس.';
                }
                if (msg.includes('خدافظ') || msg.includes('می‌روم') || msg.includes('bye')) {
                    return 'خدافظ! 👋 موفق باشی. هر وقت برگشتی، خوشحال می‌شم کمکت کنم.';
                }

                // --- سوالات متداول برنامه‌نویسی ---
                if (msg.includes('سایت') && msg.includes('ساخت')) {
                    return '🌐 برای ساخت یک سایت ساده، این مراحل رو دنبال کن:\n\n1. HTML: ساختار صفحه رو بنویس.\n2. CSS: ظاهر رو طراحی کن.\n3. JS: عملکرد و تعاملات رو اضافه کن.\n\n📚 پیشنهاد: با یک صفحه ساده شروع کن و کم‌کم پیش برو!';
                }
                if (msg.includes('خطا') || msg.includes('ارور') || msg.includes('باگ') || msg.includes('مشکل')) {
                    return '🐞 برای رفع خطا:\n\n1. پیام خطا رو دقیق بخون.\n2. خط مورد نظر رو توی کد پیدا کن.\n3. از console.log برای دیباگ استفاده کن.\n4. اگر حل نشد، کد رو تکه‌تکه تست کن.\n\n❓ کدت رو بفرست تا دقیق‌تر کمک کنم!';
                }
                if (msg.includes('ماشین حساب') || msg.includes('calculator')) {
                    return '🧮 برای ساختن ماشین حساب:\n\n1. HTML: یه صفحه با دکمه‌های اعداد و عملگرها.\n2. CSS: ظاهر رو زیبا کن.\n3. JS: توابع جمع، تفریق، ضرب و تقسیم رو بنویس.\n\n💡 مثال: از eval() می‌تونی استفاده کنی، ولی مراقب باش!';
                }
                if (msg.includes('چگونه') || msg.includes('چجوری') || msg.includes('چطور')) {
                    return '🔍 بذار قدم‌به‌قدم توضیح بدم:\n\n1. اول هدف رو مشخص کن.\n2. منابع رو جمع کن.\n3. قدم‌های کوچیک بردار.\n4. هر جا گیر کردی، بپرس!\n\n📌 حالا بگو دقیقاً چی می‌خوای؟';
                }
                if (msg.includes('پروژه') || msg.includes('نوشتن')) {
                    return '📁 برای شروع یه پروژه:\n\n1. ایده‌ت رو مشخص کن.\n2. ابزارها رو انتخاب کن.\n3. ساختار رو طراحی کن.\n4. شروع کن به نوشتن کد.\n\n🚀 اگه پروژه خاصی مد نظرته، بگو تا کمکت کنم.';
                }
                if (msg.includes('html')) {
                    return '📄 HTML زبان ساختاردهی به صفحات وب هست.\n\n✅ تگ‌های اصلی:\n- <html>: شروع سند\n- <head>: اطلاعات صفحه\n- <body>: محتوای اصلی\n\n💡 هر تگ رو با </...> می‌بندیم.';
                }
                if (msg.includes('css')) {
                    return '🎨 CSS برای ظاهر صفحه استفاده میشه.\n\n✅ مثال:\nbody {\n  background: #000;\n  color: #fff;\n}\n\n📚 برای یادگیری، با flexbox و grid شروع کن!';
                }
                if (msg.includes('javascript') || msg.includes('js')) {
                    return '⚡ جاوااسکریپت زبان برنامه‌نویسی وب هست.\n\n✅ مفاهیم اصلی:\n- متغیرها (let, const)\n- شرط‌ها (if, else)\n- حلقه‌ها (for, while)\n- توابع (function)\n\n📌 شروع کن با console.log("Hello");!';
                }
                if (msg.includes('یادگیری') || msg.includes('آموزش') || msg.includes('شروع')) {
                    return '📚 برای شروع برنامه‌نویسی:\n\n1. زبان مورد نظرت رو انتخاب کن.\n2. مفاهیم پایه رو یاد بگیر.\n3. پروژه‌های کوچیک بساز.\n4. هر روز تمرین کن.\n\n💡 پیشنهاد: با HTML و CSS شروع کن، بعد JS رو یاد بگیر.';
                }
                if (msg.includes('تمرین') || msg.includes('تمرین‌ها')) {
                    return '🎯 برای تمرین برنامه‌نویسی:\n\n1. از سایت‌های تمرینی مثل کدبزن استفاده کن.\n2. پروژه‌های کوچیک برای خودت بساز.\n3. کدهای دیگران رو بخون و تحلیل کن.\n\n💪 هر روز ۳۰ دقیقه تمرین کن، نتیجه رو می‌بینی!';
                }
                if (msg.includes('ربات') || msg.includes('هوش مصنوعی') || msg.includes('ai')) {
                    return '🤖 هوش مصنوعی می‌تونه توی برنامه‌نویسی کمک کنه:\n\n1. تولید کد\n2. پیدا کردن باگ\n3. توضیح مفاهیم\n4. بهینه‌سازی کد\n\n🚀 من اینجام تا کمکت کنم!';
                }

                // --- پاسخ‌های عمومی ---
                if (msg.includes('؟') || msg.includes('?')) {
                    return '❓ سوال خوبی پرسیدی! بذار فکر کنم...\n\n📌 می‌تونی سوال رو دقیق‌تر بپرسی تا بهتر بتونم کمک کنم.';
                }

                // --- پاسخ پیش‌فرض (وقتی چیزی پیدا نشد) ---
                return '🤔 متوجه سوال تو شدم، ولی برای جواب دقیق‌تر نیاز به اطلاعات بیشتری دارم.\n\n💡 سوال خودت رو دقیق‌تر بپرس تا بتونم کمکت کنم!\n\n📌 راهنمایی: می‌تونی درباره برنامه‌نویسی، ساخت سایت، رفع خطا یا یادگیری سوال کنی.';
            }

            // ===== افزودن پیام کاربر =====
            function addMessage(text, sender) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `msg ${sender}`;
                const icon = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
                msgDiv.innerHTML = `${icon} ${text}`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // ذخیره در تاریخچه
                chatHistory.push({ sender, text });
            }

            // ===== ارسال سریع از دکمه‌های پیشنهادی =====
            window.quickSend = function(text) {
                aiInput.value = text;
                sendAI();
            };

            // ===== ارسال پیام اصلی =====
            window.sendAI = function() {
                const text = aiInput.value.trim();
                if (!text) return;

                // نمایش پیام کاربر
                addMessage(text, 'user');
                aiInput.value = '';

                // نمایش نشانگر تایپ
                typingIndicator.style.display = 'flex';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // شبیه‌سازی تاخیر (حس واقعی)
                const delay = 500 + Math.random() * 1000;

                setTimeout(() => {
                    // مخفی کردن نشانگر تایپ
                    typingIndicator.style.display = 'none';

                    // دریافت پاسخ از هوش مصنوعی
                    const response = getAIResponse(text);

                    // نمایش پاسخ با افکت تایپ تدریجی
                    const botMsg = document.createElement('div');
                    botMsg.className = 'msg bot';
                    botMsg.innerHTML = '<i class="fas fa-robot"></i> ';
                    chatMessages.appendChild(botMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                    // تایپ تدریجی
                    let i = 0;
                    const typeInterval = setInterval(() => {
                        if (i < response.length) {
                            botMsg.innerHTML += response.charAt(i);
                            i++;
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } else {
                            clearInterval(typeInterval);
                            // ذخیره در تاریخچه
                            chatHistory.push({ sender: 'bot', text: response });
                        }
                    }, 15);
                }, delay);
            };

            // ===== پاک کردن چت =====
            window.clearChat = function() {
                if (!confirm('آیا مطمئنی می‌خوای چت رو پاک کنی؟')) return;
                chatMessages.innerHTML = `
                    <div class="msg bot"><i class="fas fa-robot"></i> سلام! من نابغه‌کد هستم. 🤖<br>هر سوالی درباره برنامه‌نویسی داری، بپرس!</div>
                `;
                chatHistory = [];
                showToast('🧹 چت پاک شد!');
            };

            // ===== خروجی چت =====
            window.exportChat = function() {
                if (chatHistory.length === 0) {
                    showToast('⚠️ هنوز پیامی توی چت نیست!');
                    return;
                }

                let output = '--- تاریخچه چت ---\n\n';
                chatHistory.forEach(msg => {
                    const prefix = msg.sender === 'user' ? '👤 کاربر' : '🤖 نابغه‌کد';
                    output += `${prefix}: ${msg.text}\n\n`;
                });

                // کپی به کلیپ‌بورد
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(output).then(() => {
                        showToast('📋 چت کپی شد!');
                    });
                } else {
                    // دانلود به عنوان فایل
                    const blob = new Blob([output], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'chat_history.txt';
                    a.click();
                    showToast('📥 چت دانلود شد!');
                }
            };

            // ==========================================================

            // ===== INIT =====
            loadFromLocal();
            codeEditor.value = files[currentLang] || '';
            updateLineNumbers();
            codeEditor.scrollTop = 0;

            setTimeout(() => { showToast('🚀 نابغه‌کد راه‌اندازی شد!'); }, 500);
        })();
    </script>

        function updatePreview() {

            const css = projectData.css || '';
            const js = projectData.js || '';

            const src = `<!DOCTYPE html>
<html>

            tab.addEventListener('click', function() {
                // حذف active از همه
                tabs.forEach(t => t.classList.remove('active'));

                if (typeof updateLineNumbers === 'function') {
                    updateLineNumbers();

                // آپدیت پیش‌نمایش
                updatePreview();

                // نمایش پیام
                if (typeof showToast === 'function') {

                }
            });
        });

        // ========== 5. وقتی کاربر توی ادیتور چیزی تغییر داد، پیش‌نمایش آپدیت نشه (فقط وقتی دکمه اجرا رو زد) ==========
        // اما دکمه‌های اجرا و بروزرسانی رو هم هندل میکنیم
        const runBtn = document.querySelector('[onclick*="runCode"]');
        if (runBtn) {
            runBtn.onclick = function(e) {
                e.preventDefault();
                // کدهای فعلی ادیتور رو بگیر و توی پروژه بریز
                const currentLang = document.querySelector('.tabs button.active')?.getAttribute('data-lang') || 'html';
                if (currentLang === 'html') projectData.html = editor.value;
                else if (currentLang === 'css') projectData.css = editor.value;
                else if (currentLang === 'javascript') projectData.js = editor.value;
                
                updatePreview();
                if (typeof showToast === 'function') {
                    showToast('🚀 پیش‌نمایش بروز شد!');
                }
            };
        }

        // دکمه رفرش پیش‌نمایش
        const refreshBtn = document.querySelector('[onclick*="refreshPreview"]');
        if (refreshBtn) {
            refreshBtn.onclick = function(e) {
                e.preventDefault();
                updatePreview();
                if (typeof showToast === 'function') {
                    showToast('🔄 پیش‌نمایش رفرش شد!');
                }
            };
        }

        // ========== 6. اولین بار پیش‌نمایش رو نشون بده ==========
        setTimeout(updatePreview, 200);

        console.log('✅ پروژه بارگذاری شد و پیش‌نمایش اجرا شد!');

    });
    // ===== اگر تمرین بود، راهنما رو توی چت نشون بده =====

        }

        window.location.href = 'done.html';
    }

    // ===== نمایش دکمه ثبت تمرین (فقط در حالت تمرین) =====
    document.addEventListener('DOMContentLoaded', function() {
        const project = JSON.parse(localStorage.getItem('currentProject'));
        const btn = document.getElementById('submitExerciseBtn');

        if (btn && project && project.isExercise) {
            btn.style.display = 'flex';
        } else if (btn) {
            btn.style.display = 'none';

    // ===== تابع ثبت تمرین =====
    function submitExercise() {
        const project = JSON.parse(localStorage.getItem('currentProject'));
        if (!project || !project.isExercise) {
            showToast('⚠️ این فقط برای تمرین‌هاست!');
            return;
        }

        const userCode = document.getElementById('codeEditor').value.trim();

        if (userCode.length < 10) {

<script>
    // ============================================================
    //  مدیریت دکمه ثبت تمرین (نسخه نهایی با افزایش XP و سکه)
    // ============================================================

    // ۱. دکمه رو پیدا کن
    const submitBtn = document.getElementById('submitExerciseBtn');

    if (submitBtn) {
        // ۲. وقتی صفحه لود شد، بررسی کن که آیا تمرین هست یا نه
        document.addEventListener('DOMContentLoaded', function() {
            const project = JSON.parse(localStorage.getItem('currentProject'));

            // اگر تمرین است، دکمه رو نشون بده، وگرنه مخفی کن
            if (project && project.isExercise) {
                submitBtn.style.display = 'flex';
            } else {
                submitBtn.style.display = 'none';
            }
        });

        // ۳. رویداد کلیک رو به دکمه وصل کن (این بار تضمینی!)
        submitBtn.addEventListener('click', function(e) {
            e.preventDefault();

            // دریافت پروژه فعلی
            const project = JSON.parse(localStorage.getItem('currentProject'));

            // اگه تمرین نیست، خطا بده
            if (!project || !project.isExercise) {
                if (typeof showToast === 'function') {
                    showToast('⚠️ این فقط برای تمرین‌هاست!');
                } else {
                    alert('⚠️ این فقط برای تمرین‌هاست!');
                }
                return;
            }

            // دریافت کد کاربر از ادیتور
            const userCode = document.getElementById('codeEditor').value.trim();

            // اگه کد خالی بود
            if (!userCode) {
                if (typeof showToast === 'function') {
                    showToast('⚠️ لطفاً کد تمرین را بنویسید!');
                } else {
                    alert('⚠️ لطفاً کد تمرین را بنویسید!');
                }
                return;
            }

            // بررسی ساده: حداقل ۱۰ کاراکتر
            if (userCode.length < 10) {
                if (typeof showToast === 'function') {
                    showToast('⚠️ کد شما خیلی کوتاه است! لطفاً بیشتر بنویسید.');
                } else {
                    alert('⚠️ کد شما خیلی کوتاه است! لطفاً بیشتر بنویسید.');
                }
                return;
            }

            // ========== افزایش XP و سکه ==========
            let currentXP = parseInt(localStorage.getItem('userXP')) || 0;
            let currentCoins = parseInt(localStorage.getItem('userCoins')) || 0;

            currentXP += 15; // ۱۵ XP برای حل تمرین
            currentCoins += 10; // ۱۰ سکه برای حل تمرین

            localStorage.setItem('userXP', currentXP.toString());
            localStorage.setItem('userCoins', currentCoins.toString());
            // ========================================

            // ===== همه چیز درست بود =====
            if (typeof showToast === 'function') {
                showToast('✅ تمرین با موفقیت ثبت شد! +۱۵ XP +۱۰ سکه');
            } else {
                alert('✅ تمرین با موفقیت ثبت شد! +۱۵ XP +۱۰ سکه');
            }

            // هدایت به done.html
            setTimeout(() => {
                window.location.href = 'done.html';
            }, 500);
        });
    }
</script>
</body>
