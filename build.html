<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نابغه‌کد · نسخه موبایل</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
}

body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #02030a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.phone {
    width: 393px;
    height: 100%;
    max-height: 852px;
    min-height: 100%;
    border-radius: 48px;
    background: #0d1117;
    box-shadow: 0 0 80px rgba(139, 92, 246, 0.25);
    overflow: hidden;
    touch-action: pan-y;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.04);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
}

.container {
    display: flex;
    flex: 1;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    direction: ltr;
}

.page {
    min-width: 100%;
    padding: 8px 12px 12px;
    color: #e8edf5;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    direction: rtl;
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    flex-shrink: 0;
}

.page-header h2 { 
    font-size: 30px; 
    font-weight: 800; 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    color: #d4dcec; 
}
.page-header h2 i { color: #8b5cf6; font-size: 16px; }

.page-actions { display: flex; gap: 4px; }
.page-actions button {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #8aa3c9;
    width: 28px;
    height: 28px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.page-actions button:hover { 
    background: rgba(139, 92, 246, 0.15); 
    color: #c4b5fd; 
    border-color: rgba(139, 92, 246, 0.2); 
}
.page-actions button:active { transform: scale(0.92); }

.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    flex-shrink: 0;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.file-tab {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: #6a7a9a;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: inherit;
}
.file-tab:hover {
    background: rgba(139, 92, 246, 0.1);
    color: #c4b5fd;
}
.file-tab.active {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25);
}
.file-tab .file-name {
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.file-tab .close-file {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    color: inherit;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
}
.file-tab .close-file:hover {
    background: rgba(239, 68, 68, 0.6);
    color: #fff;
}

.add-file-btn {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.add-file-btn:hover {
    background: rgba(34, 197, 94, 0.25);
}

.editor-wrapper {
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 14px 14px 0 0;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background: #0a0e14;
    position: relative;
    width: 100%;
}

.prism-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    background: #0d1117;
    direction: ltr !important;
}

#lineNumbers {
    width: 40px;
    height: 100%;
    background: #0d1117;
    border-right: 1px solid #262a33;
    padding: 10px 5px;
    color: #858585;
    text-align: right;
    font-family: 'Droid Sans Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
    flex-shrink: 0;
    overflow-y: auto;
}

.editor-layers {
    flex: 1;
    height: 100%;
    width: 100%;
    position: relative;
    overflow: hidden;
}

#codeEditor {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 10px 12px;
    margin: 0;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Droid Sans Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    background: #0d1117;
    color: #d4d4d4;
    caret-color: #ffffff;
    z-index: 2;
    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    text-align: left !important;
}

#codeEditor::-webkit-scrollbar, 
#lineNumbers::-webkit-scrollbar { 
    width: 5px; 
    background: transparent; 
}
#codeEditor::-webkit-scrollbar-thumb, 
#lineNumbers::-webkit-scrollbar-thumb { 
    background: #333; 
    border-radius: 4px; 
}

.preview-wrapper {
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background: #0a0e14;
    position: relative;
    width: 100%;
    height: 100%;
}

.preview-wrapper.device-mobile iframe { max-width: 375px; margin: 0 auto; display: block; }
.preview-wrapper.device-tablet iframe { max-width: 768px; margin: 0 auto; display: block; }
.preview-wrapper.device-desktop iframe { max-width: 100%; margin: 0; display: block; }

.preview-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
    position: absolute;
    top: 0;
    left: 0;
    transition: all 0.3s ease;
}

.preview-wrapper iframe.fullscreen-active {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    z-index: 9999;
    background: #ffffff;
    border-radius: 0;
}

.chat-container { 
    flex: 1 1 auto; 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
    min-height: 0; 
}
.chat-messages {
    flex: 1;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 14px;
    padding: 10px;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 80px;
}
.chat-messages .msg { 
    padding: 8px 12px; 
    border-radius: 14px; 
    max-width: 85%; 
    font-size: 13px; 
    line-height: 1.6; 
    animation: fadeIn 0.3s ease;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.chat-messages .msg.user { 
    background: linear-gradient(135deg, #7c3aed, #6d28d9); 
    color: #fff; 
    align-self: flex-end; 
    border-bottom-right-radius: 4px; 
}
.chat-messages .msg.bot { 
    background: rgba(255, 255, 255, 0.06); 
    color: #c8d8ec; 
    align-self: flex-start; 
    border-bottom-left-radius: 4px; 
    border: 1px solid rgba(255, 255, 255, 0.04); 
}
.chat-messages .msg.bot code {
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 5px;
    border-radius: 4px;
    font-family: 'Droid Sans Mono', monospace;
    font-size: 11px;
    color: #79c0ff;
}
.chat-messages .msg i { margin-left: 6px; }

@keyframes fadeIn { 
    from { opacity: 0; transform: translateY(8px); } 
    to { opacity: 1; transform: translateY(0); } 
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
    margin-bottom: 6px;
}
.suggestions button {
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.2);
    color: #c4b5fd;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: 500;
    font-family: inherit;
}
.suggestions button:hover { 
    background: rgba(139, 92, 246, 0.25); 
    transform: scale(0.95); 
}

.chat-input-row { 
    display: flex; 
    gap: 6px; 
    flex-shrink: 0; 
}
.chat-input-row input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(255, 255, 255, 0.04);
    color: #e8edf5;
    font-size: 13px;
    outline: none;
    transition: 0.2s;
    font-family: inherit;
}
.chat-input-row input:focus { 
    border-color: rgba(124, 58, 237, 0.3); 
    background: rgba(255, 255, 255, 0.06); 
}
.chat-input-row input::placeholder { color: #4a5a7a; }
.chat-input-row button { 
    padding: 10px 16px; 
    border-radius: 14px; 
    border: none; 
    background: linear-gradient(135deg, #7c3aed, #6d28d9); 
    color: #fff; 
    font-weight: 600; 
    font-size: 13px; 
    cursor: pointer; 
    transition: 0.2s; 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    font-family: inherit;
}
.chat-input-row button:hover { transform: scale(0.96); }

.typing-indicator {
    display: none;
    align-self: flex-start;
    padding: 8px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.04);
    gap: 4px;
    margin-bottom: 4px;
}
.typing-indicator span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8b5cf6;
    animation: typing 1.2s infinite ease-in-out;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
}

.nav-dots { 
    display: flex; 
    justify-content: center; 
    gap: 8px; 
    padding: 8px 0 4px; 
    flex-shrink: 0; 
}
.nav-dots span { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: rgba(255, 255, 255, 0.08); 
    transition: 0.3s; 
    cursor: pointer; 
}
.nav-dots span.active { 
    background: #8b5cf6; 
    width: 24px; 
    border-radius: 4px; 
    box-shadow: 0 0 16px rgba(139, 92, 246, 0.2); 
}

.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { 
    background: rgba(255, 255, 255, 0.1); 
    border-radius: 4px; 
}

.toast-mobile {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a2e;
    color: #e8edf5;
    padding: 12px 24px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    z-index: 9999;
    transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0;
    backdrop-filter: blur(16px);
    pointer-events: none;
}
.toast-mobile.show { 
    opacity: 1; 
    transform: translateX(-50%) translateY(0); 
}

.editor-bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #181a20;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-top: none;
    flex-shrink: 0;
    width: 100%;
    min-height: 40px;
    border-radius: 0 0 14px 14px;
}
.editor-bottom-bar button {
    background: transparent;
    border: none;
    color: #8899bb;
    font-size: 15px;
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
    min-width: 28px;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }

.modal-box {
    background: #161b22;
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 20px;
    padding: 25px;
    width: 90%;
    max-width: 320px;
}
.modal-box h3 {
    color: #c4b5fd;
    margin-bottom: 15px;
    font-size: 18px;
}
.modal-box label {
    display: block;
    color: #8aa3c9;
    font-size: 12px;
    margin-bottom: 6px;
}
.modal-box input, .modal-box select {
    width: 100%;
    padding: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    color: #e8edf5;
    font-size: 14px;
    outline: none;
    margin-bottom: 15px;
    font-family: inherit;
}
.modal-box input:focus, .modal-box select:focus {
    border-color: #8b5cf6;
}
.modal-actions {
    display: flex;
    gap: 10px;
}
.modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
}
.btn-cancel {
    background: rgba(255, 255, 255, 0.06);
    color: #8aa3c9;
}
.btn-cancel:hover {
    background: rgba(255, 255, 255, 0.12);
}
.btn-create {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: #fff;
}
.btn-create:hover { transform: scale(0.98); }

@media (max-width: 420px) {
    .phone { 
        width: 100vw; 
        height: 100dvh; 
        max-height: none;
        border-radius: 0; 
        box-shadow: none; 
        border: none; 
    }
    .editor-bottom-bar { 
        padding: 4px 6px; 
        min-height: 36px; 
        border-radius: 0; 
    }
    .page-header h2 {
        font-size: 22px;
    }
    .page-header h2 i {
        font-size: 14px;
    }
}

@media (max-height: 700px) {
    .phone { 
        height: 100dvh; 
        max-height: none;
    }
}

@supports (padding: env(safe-area-inset-bottom)) {
    .editor-bottom-bar {
        padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }
    .nav-dots {
        padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }
}
    </style>
</head>
<body>
    <div class="phone" id="phone">
        <div class="container" id="container">

            <!-- PAGE 0: AI -->
            <div class="page">
                <div class="page-header">
                    <h2><i class="fas fa-robot"></i> دستیار هوشمند</h2>
                    <div class="page-actions">
                        <button onclick="clearChat()" title="پاک کردن چت"><i class="fas fa-trash-alt"></i></button>
                        <button onclick="exportChat()" title="خروجی چت"><i class="fas fa-download"></i></button>
                    </div>
                </div>
                <div class="chat-container">
                    <div class="suggestions" id="suggestions">
                        <button onclick="quickSend('سلام')">👋 سلام</button>
                        <button onclick="quickSend('چطوری یه سایت بسازم؟')">🌐 ساخت سایت</button>
                        <button onclick="quickSend('خطای کدم رو چطور حل کنم؟')">🐞 رفع خطا</button>
                        <button onclick="quickSend('ماشین حساب بنویس')">🧮 ماشین حساب</button>
                        <button onclick="quickSend('HTML چیه؟')">📄 HTML</button>
                        <button onclick="quickSend('یادگیری از کجا شروع کنم؟')">📚 یادگیری</button>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="msg bot"><i class="fas fa-robot"></i> سلام! من نابغه‌کد هستم. 🤖<br><br>هر سوالی درباره برنامه‌نویسی داری بپرس!<br><br>💡 <b>موضوعات پیشنهادی:</b><br>• HTML / CSS / JavaScript<br>• ساخت سایت<br>• رفع خطا<br>• پروژه‌های پیشنهادی<br>• یادگیری از کجا</div>
                    </div>
                    <div class="typing-indicator" id="typingIndicator">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="aiInput" placeholder="سوال خود را بپرسید..." onkeydown="if(event.key==='Enter') sendAI()">
                        <button onclick="sendAI()"><i class="fas fa-paper-plane"></i> ارسال</button>
                    </div>
                </div>
            </div>

            <!-- PAGE 1: EDITOR -->
            <div class="page">
                <div class="page-header">
                    <h2><i class="fas fa-code"></i> ویرایشگر</h2>
                    <div class="page-actions">
                        <button onclick="runCode()" title="اجرا"><i class="fas fa-play"></i></button>
                        <button onclick="formatCode()" title="زیبا‌سازی"><i class="fas fa-wand-magic-sparkles"></i></button>
                    </div>
                </div>
                <div class="tabs" id="tabs"></div>
                <div class="editor-wrapper" id="editorWrapper">
                    <div class="prism-container">
                        <div id="lineNumbers">1</div>
                        <div class="editor-layers">
                            <textarea id="codeEditor" spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>

                <div class="editor-bottom-bar">
                    <button onclick="closeEditor()" title="بستن"><i class="fas fa-times"></i></button>
                    <button onclick="runCode()" title="اجرا"><i class="fas fa-play"></i></button>
                    <button onclick="saveFile()" title="ذخیره"><i class="fas fa-save"></i></button>
                    <button onclick="nextTab()" title="تب بعدی"><i class="fas fa-arrow-right"></i></button>
                    <button onclick="prevTab()" title="تب قبلی"><i class="fas fa-arrow-left"></i></button>
                    <button onclick="findInEditor()" title="جستجو"><i class="fas fa-search"></i></button>
                    <button onclick="undoAction()" title="بازگشت"><i class="fas fa-rotate-left"></i></button>
                    <button onclick="redoAction()" title="رفتن به جلو"><i class="fas fa-rotate-right"></i></button>
                    <button onclick="copyContent()" title="کپی"><i class="fas fa-copy"></i></button>
                    <button id="submitExerciseBtn" onclick="submitExerciseOnce()" title="ثبت تمرین" style="display:none;">
                        <i class="fas fa-check-circle"></i> ثبت تمرین
                    </button>
                    <button onclick="goToDone()" title="دریافت پروژه"><i class="fas fa-download"></i></button>
                </div>
            </div>

            <!-- PAGE 2: PREVIEW -->
            <div class="page">
                <div class="page-header">
                    <h2><i class="fas fa-eye"></i> پیش‌نمایش</h2>
                    <div class="page-actions">
                        <button onclick="refreshPreview()" title="بروزرسانی"><i class="fas fa-sync-alt"></i></button>
                        <button onclick="toggleDeviceSize()" title="تغییر سایز نمایش"><i class="fas fa-mobile-alt"></i></button>
                        <button onclick="toggleFullscreenPreview()" title="تمام صفحه"><i class="fas fa-expand"></i></button>
                        <button onclick="takeScreenshot()" title="اسکرین‌شات"><i class="fas fa-camera"></i></button>
                    </div>
                </div>
                <div class="preview-wrapper" id="previewWrapper">
                    <iframe id="frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                </div>
            </div>

        </div>

        <div class="nav-dots" id="navDots">
            <span data-page="0" class="active" onclick="goTo(0)"></span>
            <span data-page="1" onclick="goTo(1)"></span>
            <span data-page="2" onclick="goTo(2)"></span>
        </div>
    </div>

    <div class="modal-overlay" id="newFileModal">
        <div class="modal-box">
            <h3>📄 فایل جدید</h3>
            <label>نام فایل (بدون پسوند)</label>
            <input type="text" id="newFileName" placeholder="مثلاً: about">
            <label>نوع فایل</label>
            <select id="newFileType">
                <option value="html">HTML (.html)</option>
                <option value="css">CSS (.css)</option>
                <option value="js">JavaScript (.js)</option>
                <option value="json">JSON (.json)</option>
                <option value="txt">متن (.txt)</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeNewFileModal()">انصراف</button>
                <button class="btn-create" onclick="createNewFile()">ساخت</button>
            </div>
        </div>
    </div>

    <div class="toast-mobile" id="toastMobile"></div>

    <script>
        (function() {
            'use strict';

            const container = document.getElementById('container');
            const phone = document.getElementById('phone');
            const dots = document.querySelectorAll('.nav-dots span');
            const frame = document.getElementById('frame');
            const chatMessages = document.getElementById('chatMessages');
            const aiInput = document.getElementById('aiInput');
            const toastEl = document.getElementById('toastMobile');
            const codeEditor = document.getElementById('codeEditor');
            const lineNumbers = document.getElementById('lineNumbers');
            const typingIndicator = document.getElementById('typingIndicator');
            const tabsContainer = document.getElementById('tabs');
            const newFileModal = document.getElementById('newFileModal');

            let currentPage = 0;
            const totalPages = 3;
            let previewMode = 'mobile';
            let toastTimer = null;
            let chatHistory = [];

            const FILES_STORAGE_KEY = 'noboghe-mobile-files-v2';
            let files = {};
            let currentFileName = null;

            function saveFilesToLocal() {
                try {
                    localStorage.setItem(FILES_STORAGE_KEY, JSON.stringify(files));
                } catch (e) {}
            }

            function loadFilesFromLocal() {
                try {
                    const data = localStorage.getItem(FILES_STORAGE_KEY);
                    if (data) files = JSON.parse(data);
                } catch (e) { files = {}; }

                if (!files || Object.keys(files).length === 0) {
                    files = {
                        'index.html': `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمونه HTML</title>
</head>
<body>
    <h1 style="color: #8b5cf6; text-align: center; margin-top: 30px;">🚀 سلام نابغه‌کد!</h1>
    <p style="text-align: center; color: #fff; font-family: sans-serif;">این یک صفحه HTML هست که توی مرورگر اجرا میشه.</p>
    <button onclick="alert('سلام دوست من!')" style="display:block; margin: 20px auto; padding: 10px 20px; background: #8b5cf6; color: white; border: none; border-radius: 8px;">کلیک کن</button>
</body>
</html>`,
                        'style.css': `body {
    background: #1a1a2e;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
}`,
                        'script.js': `console.log("نابغه‌کد آماده است!");
alert("این یک تست از بخش JS هست!");`
                    };
                    saveFilesToLocal();
                }
            }

            function renderTabs() {
                tabsContainer.innerHTML = '';

                Object.keys(files).forEach(function(fileName) {
                    const tab = document.createElement('button');
                    tab.className = 'file-tab' + (fileName === currentFileName ? ' active' : '');

                    tab.innerHTML = 
                        '<span class="file-name">' + fileName + '</span>' +
                        '<span class="close-file" title="حذف">✕</span>';

                    tab.addEventListener('click', function(e) {
                        if (e.target.classList.contains('close-file')) return;
                        switchFile(fileName);
                    });

                    tab.querySelector('.close-file').addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteFile(fileName);
                    });

                    tabsContainer.appendChild(tab);
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'add-file-btn';
                addBtn.innerHTML = '<i class="fas fa-plus"></i>';
                addBtn.title = 'فایل جدید';
                addBtn.onclick = openNewFileModal;
                tabsContainer.appendChild(addBtn);
            }

            function switchFile(fileName) {
                if (!files[fileName]) return;

                if (currentFileName && files[currentFileName] !== undefined) {
                    files[currentFileName] = codeEditor.value;
                }

                currentFileName = fileName;
                codeEditor.value = files[fileName];
                updateLineNumbers();
                renderTabs();
                saveFilesToLocal();
            }

            function deleteFile(fileName) {
                if (Object.keys(files).length === 1) {
                    showToast('⚠️ حداقل یک فایل باید بماند!', true);
                    return;
                }

                if (!confirm('فایل "' + fileName + '" حذف شود؟')) return;

                delete files[fileName];

                if (currentFileName === fileName) {
                    currentFileName = Object.keys(files)[0];
                    codeEditor.value = files[currentFileName];
                    updateLineNumbers();
                }

                renderTabs();
                saveFilesToLocal();
                showToast('🗑️ "' + fileName + '" حذف شد');
            }

            window.openNewFileModal = function() {
                newFileModal.classList.add('show');
                document.getElementById('newFileName').value = '';
                document.getElementById('newFileName').focus();
            };

            window.closeNewFileModal = function() {
                newFileModal.classList.remove('show');
            };

            window.createNewFile = function() {
                const name = document.getElementById('newFileName').value.trim();
                const type = document.getElementById('newFileType').value;

                if (!name) {
                    showToast('⚠️ نام فایل را وارد کن!', true);
                    return;
                }

                if (!/^[a-zA-Z0-9_-]+$/.test(name)) {
                    showToast('⚠️ فقط حروف انگلیسی، عدد و خط تیره!', true);
                    return;
                }

                const fullName = name + '.' + type;

                if (files[fullName] !== undefined) {
                    showToast('⚠️ این فایل قبلاً وجود دارد!', true);
                    return;
                }

                let content = '';
                if (type === 'html') {
                    content = '<!DOCTYPE html>\n<html>\n<head>\n    <meta charset="UTF-8">\n    <title>' + name + '</title>\n</head>\n<body>\n    <h1>' + name + '</h1>\n</body>\n</html>';
                } else if (type === 'css') {
                    content = '/* ' + name + '.css */\nbody {\n    margin: 0;\n    font-family: sans-serif;\n}';
                } else if (type === 'js') {
                    content = '// ' + name + '.js\nconsole.log("' + name + ' loaded");';
                } else if (type === 'json') {
                    content = '{\n    "name": "' + name + '"\n}';
                }

                if (currentFileName && files[currentFileName] !== undefined) {
                    files[currentFileName] = codeEditor.value;
                }

                files[fullName] = content;
                currentFileName = fullName;
                codeEditor.value = content;
                updateLineNumbers();
                renderTabs();
                saveFilesToLocal();

                window.closeNewFileModal();
                showToast('✅ "' + fullName + '" ساخته شد');
            };

            function showToast(msg, isError = false) {
                toastEl.textContent = msg;
                toastEl.style.background = isError ? '#7f1d1d' : '#1a1a2e';
                toastEl.style.borderColor = isError ? '#991b1b' : 'rgba(255,255,255,0.06)';
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, 2400);
            }

            function getPhoneWidth() { return phone.clientWidth || 393; }

            window.goTo = function(page) {
                if (page < 0 || page >= totalPages) return;
                currentPage = page;
                const w = getPhoneWidth();
                container.style.transform = `translateX(-${page * w}px)`;
                dots.forEach((dot, i) => { dot.classList.toggle('active', i === page); });
            };

            let startX = 0, currentX = 0, isDragging = false;
            phone.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; currentX = startX; isDragging = true; }, { passive: true });
            phone.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                const w = getPhoneWidth();
                const baseOffset = -currentPage * w;
                container.style.transition = 'none';
                container.style.transform = `translateX(${baseOffset + diff}px)`;
            }, { passive: true });
            phone.addEventListener('touchend', function() {
                if (!isDragging) return;
                isDragging = false;
                const diff = currentX - startX;
                container.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
                if (diff < -50 && currentPage < totalPages - 1) goTo(currentPage + 1);
                else if (diff > 50 && currentPage > 0) goTo(currentPage - 1);
                else goTo(currentPage);
            }, { passive: true });

            function updateLineNumbers() {
                const lines = codeEditor.value.split('\n').length;
                let numbers = '';
                for(let i=1; i<=lines; i++) numbers += i + '\n';
                lineNumbers.innerText = numbers;
                lineNumbers.scrollTop = codeEditor.scrollTop;
            }

            codeEditor.addEventListener('input', () => {
                if (currentFileName && files[currentFileName] !== undefined) {
                    files[currentFileName] = codeEditor.value;
                    saveFilesToLocal();
                }
                updateLineNumbers();
            });

            codeEditor.addEventListener('scroll', () => {
                lineNumbers.scrollTop = codeEditor.scrollTop;
            });

            window.setLang = function(lang, btn) {
                let targetFile = null;
                if (files[lang]) {
                    targetFile = lang;
                } else if (lang === 'html' && files['index.html']) {
                    targetFile = 'index.html';
                } else if (lang === 'css' && files['style.css']) {
                    targetFile = 'style.css';
                } else if (lang === 'javascript' && files['script.js']) {
                    targetFile = 'script.js';
                }
                if (targetFile) {
                    switchFile(targetFile);
                    showToast(`🔀 تغییر به ${targetFile}`);
                }
            };

            window.formatCode = function() {
                let text = codeEditor.value;
                try {
                    const lines = text.split('\n');
                    let indent = 0;
                    const formatted = [];
                    for (let line of lines) {
                        let trimmed = line.trim();
                        if (trimmed === '') { formatted.push(''); continue; }
                        if (trimmed.startsWith('}') || trimmed.startsWith(']') || trimmed.startsWith(')')) indent = Math.max(0, indent - 1);
                        formatted.push('    '.repeat(indent) + trimmed);
                        if (trimmed.endsWith('{') || trimmed.endsWith('[') || trimmed.endsWith('(') || trimmed.endsWith('=>')) indent++;
                    }
                    const newText = formatted.join('\n');
                    if (newText !== text) {
                        codeEditor.value = newText;
                        if (currentFileName) files[currentFileName] = newText;
                        updateLineNumbers();
                        saveFilesToLocal();
                        showToast('✨ کد زیبا شد!');
                    } else showToast('ℹ️ کد در حال حاضر زیبا است');
                } catch (e) { showToast('⚠️ خطا در زیبا‌سازی', true); }
            };

            window.undoAction = function() { document.execCommand('undo'); }
            window.redoAction = function() { document.execCommand('redo'); }
            window.findInEditor = function() { showToast('🔍 جستجو در موبایل با Ctrl+F'); }

            window.copyContent = function() {
                const text = codeEditor.value;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => showToast('📄 کد کپی شد!'));
                } else showToast('⚠️ کپی در این مرورگر پشتیبانی نمی‌شود', true);
            };

            window.closeEditor = function() {
                if (confirm('آیا مطمئن هستید که می‌خواهید محتوای فعلی را پاک کنید؟')) {
                    codeEditor.value = '';
                    if (currentFileName) files[currentFileName] = '';
                    updateLineNumbers();
                    saveFilesToLocal();
                    showToast('🗑️ محتوا پاک شد');
                }
            };

            window.saveFile = function() { 
                if (currentFileName) {
                    files[currentFileName] = codeEditor.value;
                    saveFilesToLocal();
                }
                showToast('💾 فایل ذخیره شد!'); 
            };

            window.nextTab = function() {
                const keys = Object.keys(files);
                const currentIndex = keys.indexOf(currentFileName);
                const nextIndex = (currentIndex + 1) % keys.length;
                switchFile(keys[nextIndex]);
            };

            window.prevTab = function() {
                const keys = Object.keys(files);
                const currentIndex = keys.indexOf(currentFileName);
                const prevIndex = (currentIndex - 1 + keys.length) % keys.length;
                switchFile(keys[prevIndex]);
            };

            function buildPreviewHTML() {
                let htmlFile = 'index.html';
                if (!files['index.html']) {
                    const firstHtml = Object.keys(files).find(f => f.endsWith('.html'));
                    if (firstHtml) htmlFile = firstHtml;
                }

                let html = files[htmlFile] || '<h1>فایلی پیدا نشد</h1>';

                let cssContent = '';
                let jsContent = '';
                Object.keys(files).forEach(f => {
                    if (f.endsWith('.css')) cssContent += '\n' + files[f];
                    if (f.endsWith('.js')) jsContent += '\n' + files[f];
                });

                html = html.replace(/<link[^>]*href=["'][^"']+\.css["'][^>]*>/gi, '');
                html = html.replace(/<script[^>]*src=["'][^"']+\.js["'][^>]*><\/script>/gi, '');

                if (html.indexOf('</head>') !== -1) {
                    html = html.replace('</head>', '<style>' + cssContent + '</style></head>');
                } else {
                    html = '<style>' + cssContent + '</style>' + html;
                }

                if (html.indexOf('</body>') !== -1) {
                    html = html.replace('</body>', '<script>' + jsContent + '<\/script></body>');
                } else {
                    html = html + '<script>' + jsContent + '<\/script>';
                }

                return html;
            }

            function autoPreview() {
                frame.srcdoc = buildPreviewHTML();
            }

            window.runCode = function() {
                autoPreview();
                goTo(2); // بعد از اجرا، برو به تب پیش‌نمایش
            }
            window.refreshPreview = autoPreview;

            let currentDevice = 0;
            const devices = ['mobile', 'tablet', 'desktop'];
            const deviceLabels = ['📱 موبایل', '📟 تبلت', '🖥️ دسکتاپ'];

            window.toggleDeviceSize = function() {
                const wrapper = document.getElementById('previewWrapper');
                wrapper.classList.remove('device-mobile', 'device-tablet', 'device-desktop');
                frame.style.maxWidth = '';

                currentDevice = (currentDevice + 1) % devices.length;
                const device = devices[currentDevice];

                if (device === 'mobile') {
                    wrapper.classList.add('device-mobile');
                    frame.style.maxWidth = '375px';
                } else if (device === 'tablet') {
                    wrapper.classList.add('device-tablet');
                    frame.style.maxWidth = '768px';
                } else {
                    wrapper.classList.add('device-desktop');
                    frame.style.maxWidth = '100%';
                }

                showToast(`📱 ${deviceLabels[currentDevice]}`);
            };

            window.toggleFullscreenPreview = function() {
                if (frame.classList.contains('fullscreen-active')) {
                    frame.classList.remove('fullscreen-active');
                    frame.style.position = 'absolute';
                    frame.style.width = '100%';
                    frame.style.height = '100%';
                    frame.style.top = '0';
                    frame.style.left = '0';
                    frame.style.zIndex = '';
                    showToast('🔽 خروج از تمام صفحه');
                } else {
                    frame.classList.add('fullscreen-active');
                    frame.style.position = 'fixed';
                    frame.style.top = '0';
                    frame.style.left = '0';
                    frame.style.width = '100vw';
                    frame.style.height = '100vh';
                    frame.style.zIndex = '9999';
                    showToast('🔍 تمام صفحه');
                }
            };

            window.takeScreenshot = function() {
                const frameEl = document.getElementById('frame');
                if (!frameEl || !frameEl.contentDocument || !frameEl.contentDocument.body) {
                    showToast('⚠️ ابتدا پیش‌نمایش را اجرا کنید');
                    return;
                }

                html2canvas(frameEl.contentDocument.body).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'preview-screenshot.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('📸 اسکرین‌شات گرفته شد!');
                }).catch(() => {
                    showToast('⚠️ خطا در گرفتن اسکرین‌شات');
                });
            };

            // ==========================================================
            // 🧠 AI CHAT — نسخه پیشرفته (آنلاین + آفلاین)
            // ==========================================================

            function getAIResponse(message) {

                if (msg.includes('سایت') && (msg.includes('ساخت') || msg.includes('بساز') || msg.includes('چطور'))) {

}</code>

    alert('کلیک شد!');
};</code>

💡 <b>نکته:</b> با یک صفحه ساده شروع کن، بعد کم‌کم پیچیده‌ترش کن.`;
                }

                // ==================== رفع خطا ====================
                if (msg.includes('خطا') || msg.includes('ارور') || msg.includes('باگ') || msg.includes('کار نمی‌کنه') || msg.includes('error') || msg.includes('مشکل')) {
                    return `🐞 <b>برای رفع خطا این مراحل رو دنبال کن:</b>

                }

                // ==================== ماشین حساب ====================
                if (msg.includes('ماشین حساب') || msg.includes('calculator')) {
                    return `🧮 <b>ماشین حساب ساده:</b>

    &lt;/style&gt;

                }

                // ==================== HTML ====================
                if (msg.includes('html')) {
                    return `📄 <b>HTML — زبان ساختار صفحات وب</b>

&lt;body&gt;                محتوای اصلی
&lt;h1&gt;                  عنوان بزرگ

            function addMessage(text, sender) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `msg ${sender}`;
                const icon = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
                msgDiv.innerHTML = `${icon} ${text}`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                chatHistory.push({ sender, text });
            }

            window.quickSend = function(text) {
                aiInput.value = text;
                sendAI();
            };

            // ✅ تابع ارسال پیام (متصل به سرور + فالبک محلی)
            window.sendAI = async function() {
                const text = aiInput.value.trim();
                if (!text) return;

                addMessage(text, 'user');
                aiInput.value = '';

                typingIndicator.style.display = 'flex';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // آماده‌سازی تاریخچه برای سرور
                const historyForAPI = chatHistory
                    .filter((m) => m && m.text)
                    .map((m) => ({
                        role: m.sender === "user" ? "user" : "assistant",
                        content: m.text,
                    }));

                let result = { ok: false, error: "سرور تنظیم نشده" };

                // اگر تابع askAI وجود داشت (از api-client.js)، ازش استفاده کن
                if (typeof askAI === "function") {
                    result = await askAI(text, historyForAPI);
                }

                typingIndicator.style.display = 'none';

                const botMsg = document.createElement('div');
                botMsg.className = 'msg bot';
                botMsg.innerHTML = '<i class="fas fa-robot"></i> ';

                if (result.ok) {
                    // پاسخ از سرور (هوش مصنوعی واقعی)
                    botMsg.innerHTML += result.reply;
                    chatHistory.push({ sender: "bot", text: result.reply });
                } else {
                    // پاسخ آفلاین (اگر سرور خاموش بود)
                    console.warn("AI Server error, using fallback:", result.error);
                    const localReply = getAIResponse(text);
                    botMsg.innerHTML += localReply;
                    chatHistory.push({ sender: "bot", text: localReply });
                }

                chatMessages.appendChild(botMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            window.clearChat = function() {
                if (!confirm('آیا مطمئنی می‌خوای چت رو پاک کنی؟')) return;
                chatMessages.innerHTML = `
                    <div class="msg bot"><i class="fas fa-robot"></i> سلام! من نابغه‌کد هستم. 🤖<br><br>هر سوالی درباره برنامه‌نویسی داری بپرس!<br><br>💡 <b>موضوعات پیشنهادی:</b><br>• HTML / CSS / JavaScript<br>• ساخت سایت<br>• رفع خطا<br>• پروژه‌های پیشنهادی<br>• یادگیری از کجا</div>
                `;
                chatHistory = [];
                showToast('🧹 چت پاک شد!');
            };

            window.exportChat = function() {
                if (chatHistory.length === 0) {
                    showToast('⚠️ هنوز پیامی توی چت نیست!');
                    return;
                }

                let output = '--- تاریخچه چت ---\n\n';
                chatHistory.forEach(msg => {
                    const prefix = msg.sender === 'user' ? '👤 کاربر' : '🤖 نابغه‌کد';
                    output += `${prefix}: ${msg.text}\n\n`;
                });

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(output).then(() => {
                        showToast('📋 چت کپی شد!');
                    });
                } else {
                    const blob = new Blob([output], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'chat_history.txt';
                    a.click();
                    showToast('📥 چت دانلود شد!');
                }
            };

            // ===== INIT =====
            loadFilesFromLocal();
            currentFileName = Object.keys(files)[0];
            codeEditor.value = files[currentFileName];
            updateLineNumbers();
            renderTabs();
            codeEditor.scrollTop = 0;
            autoPreview();

            newFileModal.addEventListener('click', function(e) {
                if (e.target === newFileModal) {
                    window.closeNewFileModal();
                }
            });

            setTimeout(() => { showToast('🚀 نابغه‌کد راه‌اندازی شد!'); }, 500);
        })();
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const raw = localStorage.getItem('currentProject');
        if (!raw) return;

        let data;
        try {
            data = JSON.parse(raw);
        } catch (e) { return; }

        if (!data || !data.html) return;

        try {
            const existingFiles = JSON.parse(localStorage.getItem('noboghe-mobile-files-v2') || '{}');
            existingFiles['index.html'] = data.html || '';
            if (data.css) existingFiles['style.css'] = data.css;
            if (data.js) existingFiles['script.js'] = data.js;
            localStorage.setItem('noboghe-mobile-files-v2', JSON.stringify(existingFiles));
        } catch (e) {}
    });
    </script>

    <script>
    window.goToDone = function() {
        const data = JSON.parse(localStorage.getItem('currentProject'));
        let projectName = 'پروژه من';

        if (data && data.name) {
            projectName = data.name;
        }
        localStorage.setItem('selectedIdea', projectName);

        try {
            const files = JSON.parse(localStorage.getItem('noboghe-mobile-files-v2') || '{}');
            localStorage.setItem('html', files['index.html'] || '');
            localStorage.setItem('css', files['style.css'] || '');
            localStorage.setItem('js', files['script.js'] || '');
        } catch (e) {
            if (data) {
                localStorage.setItem('html', data.html || '');
                localStorage.setItem('css', data.css || '');
                localStorage.setItem('js', data.js || '');
            }
        }

        window.location.href = 'done.html';
    };

    document.addEventListener('DOMContentLoaded', function() {
        const project = JSON.parse(localStorage.getItem('currentProject'));
        const btn = document.getElementById('submitExerciseBtn');

        if (btn && project && project.isExercise) {
            btn.style.display = 'flex';
        } else if (btn) {
            btn.style.display = 'none';
        }
    });

    function submitExerciseOnce() {
        const project = JSON.parse(localStorage.getItem('currentProject'));

        if (!project || !project.isExercise) {
            alert('⚠️ این فقط برای تمرین‌هاست!');
            return;
        }

        const userCode = document.getElementById('codeEditor').value.trim();

        if (!userCode) {
            alert('⚠️ لطفاً کد تمرین را بنویسید!');
            return;
        }

        if (userCode.length < 10) {
            alert('⚠️ کد شما خیلی کوتاه است!');
            return;
        }

        let currentXP = parseInt(localStorage.getItem('userXP')) || 0;
        let currentCoins = parseInt(localStorage.getItem('userCoins')) || 0;

        currentXP += 15;
        currentCoins += 10;

        localStorage.setItem('userXP', currentXP.toString());
        localStorage.setItem('userCoins', currentCoins.toString());

        alert('✅ تمرین ثبت شد! +۱۵ XP +۱۰ سکه');

        setTimeout(() => {
            window.location.href = 'done.html';
        }, 500);
    }
    </script>
