<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | نابغه‌کد</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { background: #02030a; color: #e8edf5; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 20px; }
        .admin-panel { max-width: 1100px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; padding: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .top-bar h2 { color: #d4dcec; font-size: 22px; margin: 0; }
        .top-bar h2 i { color: #8b5cf6; margin-left: 8px; }
        #logout { background: #da3633; color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        #logout:hover { background: #f85149; transform: scale(0.96); }

        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        #search { flex: 1; padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; color: #e8edf5; font-size: 14px; outline: none; transition: 0.2s; font-family: inherit; }
        #search:focus { border-color: rgba(139, 92, 246, 0.3); background: rgba(255, 255, 255, 0.06); }
        #userCount { color: #8aa3c9; font-size: 14px; margin-bottom: 15px; display: block; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(255, 255, 255, 0.02); border-radius: 12px; overflow: hidden; min-width: 800px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 13px; }
        th { background: rgba(139, 92, 246, 0.1); color: #c4b5fd; font-weight: 600; white-space: nowrap; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .password-cell { font-family: monospace; background: rgba(250, 204, 21, 0.1); padding: 4px 8px; border-radius: 6px; color: #facc15; direction: ltr; display: inline-block; cursor: pointer; user-select: all; }
        .password-cell.admin-protected { color: #8aa3c9; background: rgba(139, 92, 246, 0.1); cursor: default; }
        
        .action-btns { display: flex; gap: 5px; }
        button.delete { background: #da3633; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        button.delete:hover { background: #f85149; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        .modal-content { background: #1a1a2e; padding: 30px; width: 90%; max-width: 400px; margin: 10% auto; border-radius: 20px; text-align: center; border: 1px solid rgba(139, 92, 246, 0.2); }

        .orders-section { margin-top: 30px; padding: 20px; background: rgba(255, 255, 255, 0.02); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .orders-section h3 { color: #c4b5fd; margin-bottom: 15px; font-size: 18px; }
        .order-item { background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .order-item button { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; margin: 2px; font-family: inherit; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="top-bar">
            <h2><i class="fas fa-user-shield"></i> پنل مدیریت</h2>
            <button id="logout">خروج</button>
        </div>

        <div class="search-row">
            <input type="text" id="search" placeholder="🔍 جستجو در نام، ایمیل یا شماره...">
        </div>

        <span id="userCount"></span>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>نام</th>
                        <th>شماره موبایل</th>
                        <th>ایمیل</th>
                        <th>پسورد</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>

        <div class="orders-section">
            <h3>📦 سفارشات سکه</h3>
            <div id="ordersList"></div>
        </div>

        <div class="orders-section" style="margin-top: 30px;">
            <h3>💬 پیام‌های کاربران</h3>
            <div id="userMessagesList"></div>
        </div>
    </div>

    <!-- مودال ارسال پیام -->
    <div id="messageModal" class="modal" style="align-items: center; justify-content: center;">
        <div class="modal-content">
            <h2 style="color: #c4b5fd; margin-bottom: 15px;">✉️ ارسال پیام به <span id="messageUserName"></span></h2>
            <textarea id="messageText" placeholder="متن پیام خود را بنویسید..." style="width: 100%; height: 100px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 15px; font-family: inherit; resize: none;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeMessageModal()" style="flex: 1; padding: 10px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-family: inherit;">انصراف</button>
                <button class="btn-send" onclick="sendMessage()" style="flex: 1; padding: 10px; border-radius: 10px; border: none; background: #8b5cf6; color: #fff; font-weight: bold; cursor: pointer; font-family: inherit;">ارسال پیام</button>
            </div>
        </div>
    </div>

    <style>
        #messageModal.show { display: flex !important; }
    </style>

    <script src="api.js"></script>
    <script src="admin.js"></script>
</body>
</html>
