<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | نابغه‌کد</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { background: #02030a; color: #e8edf5; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 20px; }
        .admin-panel { max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; padding: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .top-bar h2 { color: #d4dcec; font-size: 22px; margin: 0; }
        .top-bar h2 i { color: #8b5cf6; margin-left: 8px; }
        #logout { background: #da3633; color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        #logout:hover { background: #f85149; transform: scale(0.96); }

        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        #search { flex: 1; padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; color: #e8edf5; font-size: 14px; outline: none; transition: 0.2s; font-family: inherit; }
        #search:focus { border-color: rgba(139, 92, 246, 0.3); background: rgba(255, 255, 255, 0.06); }
        #userCount { color: #8aa3c9; font-size: 14px; margin-bottom: 15px; display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(255, 255, 255, 0.02); border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 14px; }
        th { background: rgba(139, 92, 246, 0.1); color: #c4b5fd; font-weight: 600; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        .action-btns { display: flex; gap: 5px; }
        button.delete { background: #da3633; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        button.delete:hover { background: #f85149; }
        button.edit { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        button.edit:hover { background: #2ea043; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        .modal-content { background: #1a1a2e; padding: 30px; width: 90%; max-width: 400px; margin: 10% auto; border-radius: 20px; text-align: center; border: 1px solid rgba(139, 92, 246, 0.2); animation: fadeIn 0.3s; }
        .modal-content h2 { color: #c4b5fd; margin-bottom: 20px; }
        .modal input, .modal select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.06); background: rgba(255, 255, 255, 0.04); color: #e8edf5; font-size: 14px; outline: none; font-family: inherit; }
        .modal input:focus, .modal select:focus { border-color: #8b5cf6; }
        #saveEdit { width: 100%; margin-top: 15px; padding: 12px; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border: none; cursor: pointer; font-size: 15px; font-weight: 600; font-family: inherit; }
        #saveEdit:hover { transform: scale(0.98); }
        .close { float: left; cursor: pointer; font-size: 24px; color: #8aa3c9; transition: 0.2s; }
        .close:hover { color: #f85149; }

        .orders-section { margin-top: 30px; padding: 20px; background: rgba(255, 255, 255, 0.02); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .orders-section h3 { color: #c4b5fd; margin-bottom: 15px; font-size: 18px; }
        .order-item { background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .order-item button { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; margin: 2px; font-family: inherit; }
        .order-item button.approve { background: #238636; color: white; }
        .order-item button.reject { background: #da3633; color: white; }
        .order-item button:disabled { opacity: 0.5; cursor: not-allowed; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="top-bar">
            <h2><i class="fas fa-user-shield"></i> پنل مدیریت</h2>
            <button id="logout">خروج</button>
        </div>

        <div class="search-row">
            <input type="text" id="search" placeholder="🔍 جستجو در نام، ایمیل یا شماره...">
        </div>

        <span id="userCount"></span>

        <table>
            <thead>
                <tr>
                    <th>نام</th>
                    <th>شماره / ایمیل</th>
                    <th>تاریخ عضویت</th>
                    <th>وضعیت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>

        <div class="orders-section">
            <h3>📦 سفارشات سکه</h3>
            <div id="ordersList"></div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>ویرایش کاربر</h2>
            <input id="editName" placeholder="نام">
            <input id="editPhone" placeholder="شماره یا ایمیل">
            <select id="editRole">
                <option value="user">کاربر عادی</option>
                <option value="admin">ادمین</option>
            </select>
            <button id="saveEdit">ذخیره تغییرات</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
