<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | نابغه‌کد</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #02030a; color: #e8edf5; min-height: 100vh; padding: 20px; }
        .admin-panel { max-width: 1100px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; padding: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .top-bar h2 { color: #d4dcec; font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
        .top-bar h2 i { color: #8b5cf6; }
        #logout { background: #da3633; color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; }

        .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .admin-tabs button { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #8aa3c9; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: 0.2s; font-family: inherit; }
        .admin-tabs button.active { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border-color: transparent; box-shadow: 0 4px 15px rgba(124,58,237,0.2); }
        .admin-tabs button:hover:not(.active) { background: rgba(139,92,246,0.1); color: #c4b5fd; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        #search { flex: 1; padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; color: #e8edf5; font-size: 14px; outline: none; font-family: inherit; }
        #userCount { color: #8aa3c9; font-size: 14px; margin-bottom: 15px; display: block; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(255, 255, 255, 0.02); border-radius: 12px; overflow: hidden; min-width: 700px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 13px; }
        th { background: rgba(139, 92, 246, 0.1); color: #c4b5fd; font-weight: 600; white-space: nowrap; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .password-cell { font-family: monospace; background: rgba(250, 204, 21, 0.1); padding: 4px 8px; border-radius: 6px; color: #facc15; direction: ltr; display: inline-block; cursor: pointer; user-select: all; }
        .password-cell.admin-protected { color: #8aa3c9; background: rgba(139, 92, 246, 0.1); cursor: default; }

        .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        button.delete { background: #da3633; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: inherit; }

        .order-item { background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid rgba(139, 92, 246, 0.2); }
        .order-item button { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; margin: 2px; font-family: inherit; }

        .report-card { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .report-card .report-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .report-card .report-reason { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; color: #f87171; font-size: 13px; }
        .report-card .report-actions { display: flex; gap: 8px; justify-content: flex-end; }

        /* مودال */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a2e; padding: 25px; width: 90%; max-width: 400px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.3); }
        .modal-content h2 { color: #c4b5fd; margin-bottom: 15px; font-size: 18px; text-align: center; }
        .modal-content textarea { width: 100%; height: 120px; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 15px; font-family: inherit; resize: none; outline: none; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-cancel { background: rgba(255, 255, 255, 0.06); color: #8aa3c9; }
        .btn-confirm { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="top-bar">
            <h2><i class="fas fa-user-shield"></i> پنل مدیریت</h2>
            <button id="logout">خروج</button>
        </div>

        <div class="admin-tabs">
            <button class="active" onclick="switchAdminTab('users', this)">👥 کاربران</button>
            <button onclick="switchAdminTab('orders', this)">🪙 سفارش سکه</button>
            <button onclick="switchAdminTab('messages', this)">💬 پیام‌های کاربران</button>
            <button onclick="switchAdminTab('reports', this)">🚨 گزارش‌ها</button>
            <button onclick="switchAdminTab('ad-requests', this)">📢 درخواست تبلیغات</button>
        </div>

        <!-- تب کاربران -->
        <div id="tab-users" class="tab-content active">
            <div class="search-row">
                <input type="text" id="search" placeholder="🔍 جستجو در نام، ایمیل یا شماره...">
            </div>
            <span id="userCount"></span>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>نام</th>
                            <th>شماره</th>
                            <th>ایمیل</th>
                            <th>پسورد</th>
                            <th>وضعیت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>
        </div>

        <!-- تب سفارشات -->
        <div id="tab-orders" class="tab-content">
            <div id="ordersList"></div>
        </div>

        <!-- تب پیام‌ها -->
        <div id="tab-messages" class="tab-content">
            <div id="userMessagesList"></div>
        </div>

        <!-- تب گزارش‌ها -->
        <div id="tab-reports" class="tab-content">
            <div id="reportsList"></div>
        </div>

        <!-- تب درخواست‌های تبلیغات -->
        <div id="tab-ad-requests" class="tab-content">
            <div id="adRequestsList"></div>
        </div>
    </div>

    <!-- مودال ارسال پیام -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <h2>✉️ ارسال پیام به <span id="messageUserName"></span></h2>
            <textarea id="messageText" placeholder="متن پیام خود را بنویسید..."></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeMessageModal()">انصراف</button>
                <button class="btn-confirm" onclick="sendMessage()">ارسال پیام</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="admin.js"></script>
</body>
</html>
