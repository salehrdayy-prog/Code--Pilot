<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شبکه برنامه‌نویسان | نابغه‌کد</title>
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #02030a; color: #e8edf5; height: 100vh; display: flex; overflow: hidden; }

        /* ===== سایدبار ===== */
        .sidebar {
            width: 340px;
            background: #0d1117;
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: right 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header h2 { font-size: 18px; color: #fff; flex: 1; }
        .sidebar-header i { color: #8b5cf6; }

        .back-home-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #8aa3c9;
            width: 35px; height: 35px;
            border-radius: 10px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }

        /* تب‌ها */
        .sidebar-tabs {
            display: flex;
            padding: 10px;
            gap: 5px;
            background: rgba(0,0,0,0.2);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #8aa3c9;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
        }

        .search-box {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .search-box input:focus { border-color: rgba(139, 92, 246, 0.3); }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
        }
        .contact-item:hover { background: rgba(255,255,255,0.03); }
        .contact-item.active {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .contact-avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #2d2d4e);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: #8b5cf6;
            flex-shrink: 0;
            position: relative;
        }
        .contact-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 2px; right: 2px;
            width: 12px; height: 12px;
            background: #4ade80;
            border-radius: 50%;
            border: 2px solid #0d1117;
        }

        .contact-info { flex: 1; overflow: hidden; }
        .contact-name { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .contact-name .admin-badge {
            font-size: 10px;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
        }
        .contact-last-msg { font-size: 12px; color: #8aa3c9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .unread-badge {
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ===== بخش چت ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #02030a;
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            flex-shrink: 0;
        }
        .chat-header .back-btn {
            display: none;
            background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
            padding: 5px;
        }
        .chat-header h3 { font-size: 16px; }
        .chat-header .status { font-size: 12px; color: #4ade80; }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: radial-gradient(circle at center, rgba(139,92,246,0.03) 0%, transparent 70%);
        }

        .msg-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .msg-bubble.incoming {
            background: rgba(255, 255, 255, 0.06);
            color: #e8edf5;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .msg-bubble.outgoing {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
        }
        .msg-time {
            font-size: 10px;
            margin-top: 5px;
            text-align: left;
            opacity: 0.6;
            display: block;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: rgba(13, 17, 23, 0.8);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        .chat-input-area input:focus { border-color: #8b5cf6; background: rgba(255,255,255,0.06); }
        .chat-input-area button {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .chat-input-area button:hover { transform: scale(1.05); }

        .empty-chat {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #8aa3c9; text-align: center; padding: 20px;
        }
        .empty-chat i { font-size: 70px; color: rgba(139, 92, 246, 0.15); margin-bottom: 20px; }
        .empty-chat h3 { color: #c4b5fd; margin-bottom: 10px; }

        /* اسکرول‌بار */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* موبایل */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; z-index: 20; height: 100%; right: 0; }
            .sidebar.hidden { right: -100%; }
            .chat-header .back-btn { display: block; }
            .msg-bubble { max-width: 85%; }
        }
    </style>
</head>
<body>

    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-users"></i>
            <h2>شبکه برنامه‌نویسان</h2>
            <a href="dashboard.html" class="back-home-btn"><i class="fas fa-home"></i></a>
        </div>
        
        <div class="sidebar-tabs">
            <button class="tab-btn active" id="tabChats" onclick="switchTab('chats')">💬 چت‌ها</button>
            <button class="tab-btn" id="tabUsers" onclick="switchTab('users')">👥 کاربران</button>
        </div>

        <div class="search-box" id="searchBox" style="display: none;">
            <input type="text" id="searchInput" placeholder="🔍 جستجوی برنامه‌نویس..." oninput="filterUsers()">
        </div>

        <div class="list-container" id="listContainer">
            <!-- لیست توسط JS پر می‌شود -->
        </div>
    </div>

    <!-- بخش چت -->
    <div class="chat-area">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <button class="back-btn" onclick="showSidebar()"><i class="fas fa-arrow-right"></i></button>
            <div class="contact-avatar" style="width: 40px; height: 40px; font-size: 16px;" id="chatAvatar">👤</div>
            <div style="flex: 1;">
                <h3 id="chatName">کاربر</h3>
                <span class="status">آنلاین</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat" id="emptyChat">
                <i class="fas fa-comments"></i>
                <h3>به شبکه برنامه‌نویسان خوش آمدید 🚀</h3>
                <p style="font-size: 13px; margin-top: 10px; max-width: 300px;">
                    از تب «کاربران»، یک هم‌فکر پیدا کن و شروع به چت کن!
                </p>
            </div>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="messenger.js"></script>
</body>
</html>
