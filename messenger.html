<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شبکه برنامه‌نویسان | نابغه‌کد</title>
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 👈 قفل کردن کل صفحه روی ابعاد دقیق گوشی (بدون فضای خالی پایین) */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0a0a0f; color: #e8edf5; }
        body { display: flex; position: fixed; inset: 0; }

        /* ===== سایدبار ===== */
        .sidebar {
            width: 100%; max-width: 380px; background: #111827;
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; height: 100%;
            transition: right 0.3s cubic-bezier(0.22, 1, 0.36, 1); z-index: 100;
        }

        .sidebar-header {
            padding: 15px 20px; background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .sidebar-header h2 { font-size: 16px; color: #fff; flex: 1; font-weight: 700; }
        .sidebar-header i.fa-users { color: #8b5cf6; }

        .icon-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            color: #8aa3c9; width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(139, 92, 246, 0.2); color: #fff; }

        .sidebar-tabs { display: flex; padding: 10px 15px; gap: 5px; background: #111827; border-bottom: 1px solid rgba(255,255,255,0.03); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #8aa3c9; font-family: inherit; font-size: 13px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }

        .search-box { padding: 10px 15px; background: #111827; flex-shrink: 0; }
        .search-box input { width: 100%; padding: 10px 15px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #fff; font-size: 13px; outline: none; font-family: inherit; transition: 0.2s; }
        .search-box input:focus { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05); }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }

        .contact-item {
            padding: 12px 15px; border-radius: 14px; margin-bottom: 5px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; position: relative;
        }
        .contact-item:hover { background: rgba(255,255,255,0.03); }
        .contact-item.active { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.2); }

        .contact-avatar {
            width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #1a1a2e, #2d2d4e);
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #8b5cf6; flex-shrink: 0; position: relative;
        }
        .contact-avatar.online::after { content: ''; position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #4ade80; border-radius: 50%; border: 2px solid #111827; }

        .contact-info { flex: 1; overflow: hidden; }
        .contact-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; color: #e8edf5; }
        .contact-name .admin-badge { font-size: 10px; background: rgba(139, 92, 246, 0.2); color: #c4b5fd; padding: 2px 6px; border-radius: 6px; font-weight: normal; }
        .contact-last-msg { font-size: 12px; color: #8aa3c9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .unread-badge { background: #ef4444; color: white; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; }
        .pin-icon { color: #facc15; font-size: 12px; margin-left: auto; }

        .chat-actions-btn { background: transparent; border: none; color: #6a7a9a; cursor: pointer; padding: 5px; font-size: 16px; }
        .chat-actions-btn:hover { color: #fff; }
        
        .dropdown-menu {
            position: absolute; top: 45px; left: 15px; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; display: none; flex-direction: column; z-index: 50; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-width: 140px; overflow: hidden;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu button {
            background: transparent; border: none; color: #e8edf5; padding: 10px 15px; text-align: right;
            font-family: inherit; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .dropdown-menu button:hover { background: rgba(139, 92, 246, 0.15); }
        .dropdown-menu button.danger { color: #ef4444; }
        .dropdown-menu button.danger:hover { background: rgba(239, 68, 68, 0.15); }

        /* ===== بخش چت ===== */
        .chat-area { 
            flex: 1; display: flex; flex-direction: column; background: #0a0a0f; 
            height: 100%; width: 100%; overflow: hidden; 
        }

        .chat-header {
            padding: 10px 20px; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; z-index: 10; flex-shrink: 0; height: 65px;
        }
        .chat-header .back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px; }
        .chat-header .header-info { flex: 1; display: flex; flex-direction: column; cursor: pointer; }
        .chat-header h3 { font-size: 16px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 5px; }
        .chat-header h3 span { font-size: 12px; color: #8aa3c9; font-weight: normal; }
        .chat-header .status { font-size: 12px; color: #4ade80; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
        .chat-header .status::before { content: ''; width: 6px; height: 6px; background: #4ade80; border-radius: 50%; display: inline-block; }

        .chat-messages {
            flex: 1; overflow-y: auto; min-height: 0; padding: 15px 12px;
            display: flex; flex-direction: column; gap: 6px;
            background-color: #0a0a0f; background-image: radial-gradient(rgba(139, 92, 246, 0.08) 1px, transparent 1px); background-size: 20px 20px;
        }

        .msg-bubble { 
            max-width: 80%; padding: 10px 14px 24px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; position: relative; word-wrap: break-word; 
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .msg-bubble.incoming { background: #1e1e2d; color: #e8edf5; align-self: flex-start; border-radius: 16px 16px 16px 4px; border: 1px solid rgba(255,255,255,0.03); }
        .msg-bubble.outgoing { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; align-self: flex-end; border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.15); }
        
        .msg-time { font-size: 10px; position: absolute; bottom: 4px; left: 8px; opacity: 0.7; }
        .msg-sender-name { font-size: 11px; color: #facc15; margin-bottom: 4px; font-weight: bold; display: block; }

        /* 👈 نوار ارسال چسبیده به پایین */
        .chat-input-area {
            padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
            background: #111827; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; gap: 8px; align-items: center; flex-shrink: 0; z-index: 10;
        }
        .chat-input-area input { flex: 1; padding: 12px 18px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03); color: #fff; font-size: 14px; outline: none; transition: 0.2s; font-family: inherit; }
        .chat-input-area input:focus { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05); }
        .chat-input-area button { width: 44px; height: 44px; border-radius: 50%; border: none; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }

        .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8aa3c9; text-align: center; padding: 20px; background-image: radial-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px); background-size: 20px 20px; }
        .empty-chat i { font-size: 70px; color: rgba(139, 92, 246, 0.15); margin-bottom: 15px; }
        .empty-chat h3 { color: #c4b5fd; margin-bottom: 10px; font-size: 18px; }

        /* مودال‌ها */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #161b22; border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; }
        .modal-box h3 { color: #c4b5fd; margin-bottom: 15px; font-size: 18px; text-align: center; }
        .modal-box label { display: block; color: #8aa3c9; font-size: 13px; margin-bottom: 6px; margin-top: 10px; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #e8edf5; font-size: 14px; outline: none; margin-bottom: 10px; font-family: inherit; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-cancel { background: rgba(255, 255, 255, 0.06); color: #8aa3c9; }
        .btn-confirm { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; }

        /* لیست اعضا */
        .member-list { max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .member-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .member-avatar { width: 30px; height: 30px; border-radius: 50%; background: #2d2d4e; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8b5cf6; }
        .member-name { font-size: 14px; flex: 1; }
        .member-role { font-size: 11px; color: #facc15; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; max-width: 100%; position: absolute; height: 100%; right: 0; }
            .sidebar.hidden { right: -100%; }
            .chat-header .back-btn { display: block; }
            .msg-bubble { max-width: 85%; }
            .chat-area { width: 100vw; }
        }
    </style>
</head>
<body>

    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-users"></i>
            <h2>شبکه برنامه‌نویسان</h2>
            <button class="icon-btn" onclick="openJoinModal()" title="پیوستن با لینک"><i class="fas fa-link"></i></button>
            <button class="icon-btn" onclick="openCreateRoomModal()" title="ساخت گروه/کانال"><i class="fas fa-plus"></i></button>
            <a href="dashboard.html" class="icon-btn"><i class="fas fa-home"></i></a>
        </div>
        
        <div class="sidebar-tabs">
            <button class="tab-btn active" id="tabChats" onclick="switchTab('chats')">💬 چت‌ها</button>
            <button class="tab-btn" id="tabUsers" onclick="switchTab('users')">👥 کاربران</button>
        </div>

        <div class="search-box" id="searchBox" style="display: none;">
            <input type="text" id="searchInput" placeholder="🔍 جستجوی برنامه‌نویس..." oninput="filterUsers()">
        </div>

        <div class="list-container" id="listContainer"></div>
    </div>

    <!-- بخش چت -->
    <div class="chat-area">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <button class="back-btn" onclick="showSidebar()"><i class="fas fa-arrow-right"></i></button>
            <div class="contact-avatar" style="width: 40px; height: 40px; font-size: 16px;" id="chatAvatar" onclick="openRoomInfo()">👤</div>
            <div class="header-info" onclick="openRoomInfo()">
                <h3 id="chatName">کاربر <span id="memberCount"></span></h3>
                <span class="status" id="chatStatus">آنلاین</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat" id="emptyChat">
                <i class="fas fa-comments"></i>
                <h3>به شبکه برنامه‌نویسان خوش آمدید 🚀</h3>
                <p>از تب «کاربران» شروع کن یا یک گروه/کانال بساز!</p>
            </div>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- مودال ساخت گروه/کانال -->
    <div class="modal-overlay" id="createRoomModal">
        <div class="modal-box">
            <h3>🚀 ساخت گروه یا کانال</h3>
            <label>نوع:</label>
            <select id="roomType">
                <option value="group">👥 گروه (چت چند نفره)</option>
                <option value="channel">📢 کانال (فقط ادمین پیام می‌دهد)</option>
            </select>
            <label>نام:</label>
            <input type="text" id="roomName" placeholder="مثلاً: برنامه‌نویسان پایتون">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateRoomModal()">انصراف</button>
                <button class="btn-confirm" onclick="createRoom()">ساخت</button>
            </div>
        </div>
    </div>

    <!-- 👈 مودال پیوستن با لینک -->
    <div class="modal-overlay" id="joinModal">
        <div class="modal-box">
            <h3>🔗 پیوستن به گروه</h3>
            <label>لینک یا کد دعوت:</label>
            <input type="text" id="joinLinkCode" placeholder="مثلاً: a1b2c3d4">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeJoinModal()">انصراف</button>
                <button class="btn-confirm" onclick="joinRoom()">پیوستن</button>
            </div>
        </div>
    </div>

    <!-- 👈 مودال اطلاعات گروه (اعضا و لینک) -->
    <div class="modal-overlay" id="roomInfoModal">
        <div class="modal-box">
            <h3 id="roomInfoTitle">اطلاعات گروه</h3>
            <p style="color: #8aa3c9; font-size: 13px; margin-bottom: 15px; text-align: center;">کد دعوت: <strong id="roomLinkCode" style="color: #facc15;"></strong></p>
            
            <div class="modal-actions" style="margin-bottom: 15px;">
                <button class="btn-confirm" onclick="copyInviteLink()" style="background: #238636;">📋 کپی لینک دعوت</button>
                <button class="btn-cancel" onclick="deleteRoom()" style="background: #da3633; color: white;">🗑 حذف گروه</button>
            </div>

            <label>لیست اعضا (<span id="roomMembersCount">0</span> نفر):</label>
            <div class="member-list" id="roomMembersList"></div>

            <div class="modal-actions" style="margin-top: 15px;">
                <button class="btn-cancel" onclick="closeRoomInfo()">بستن</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="messenger.js"></script>
</body>
</html>
