<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شبکه برنامه‌نویسان | نابغه‌کد</title>
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 👈 استفاده از 100dvh برای تطبیق دقیق با ارتفاع هر گوشی */
        html, body { 
            height: 100vh; 
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            background: #0a0a0f; 
            color: #e8edf5; 
            display: flex; 
        }

        /* ===== سایدبار (لیست چت‌ها) ===== */
        .sidebar {
            width: 100%;
            max-width: 380px;
            background: #111827;
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: right 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 15px 20px;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .sidebar-header h2 { font-size: 18px; color: #fff; flex: 1; font-weight: 700; }
        .sidebar-header i.fa-users { color: #8b5cf6; }

        .back-home-btn, .new-chat-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #8aa3c9;
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .back-home-btn:hover, .new-chat-btn:hover { background: rgba(139, 92, 246, 0.2); color: #fff; }

        /* تب‌ها */
        .sidebar-tabs {
            display: flex;
            padding: 10px 15px;
            gap: 5px;
            background: #111827;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #8aa3c9;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }

        .search-box {
            padding: 10px 15px;
            background: #111827;
            flex-shrink: 0;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }
        .search-box input:focus { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05); }

        /* لیست مخاطبین با اسکرول مستقل */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 0; /* 👈 کلید اسکرول درست در فبکس */
        }

        .contact-item {
            padding: 12px 15px;
            border-radius: 14px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
            position: relative;
        }
        .contact-item:hover { background: rgba(255,255,255,0.03); }
        .contact-item.active { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.2); }

        .contact-avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #2d2d4e);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: #8b5cf6;
            flex-shrink: 0;
            position: relative;
        }
        .contact-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 2px; right: 2px;
            width: 12px; height: 12px;
            background: #4ade80;
            border-radius: 50%;
            border: 2px solid #111827;
        }

        .contact-info { flex: 1; overflow: hidden; }
        .contact-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; color: #e8edf5; }
        .contact-name .admin-badge { font-size: 10px; background: rgba(139, 92, 246, 0.2); color: #c4b5fd; padding: 2px 6px; border-radius: 6px; font-weight: normal; }
        .contact-last-msg { font-size: 12px; color: #8aa3c9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .unread-badge { background: #ef4444; color: white; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; }

        .chat-actions-btn { background: transparent; border: none; color: #6a7a9a; cursor: pointer; padding: 5px; font-size: 16px; }
        .chat-actions-btn:hover { color: #fff; }
        
        .dropdown-menu {
            position: absolute;
            top: 40px; left: 10px;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-width: 120px;
            overflow: hidden;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu button {
            background: transparent; border: none; color: #e8edf5; padding: 10px 15px; text-align: right;
            font-family: inherit; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .dropdown-menu button:hover { background: rgba(139, 92, 246, 0.15); }
        .dropdown-menu button.danger { color: #ef4444; }
        .dropdown-menu button.danger:hover { background: rgba(239, 68, 68, 0.15); }

        /* ===== بخش چت اصلی ===== */
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #0a0a0f; 
            position: relative; 
            height: 100%; 
            width: 100%; 
            overflow: hidden;
        }

        .chat-header {
            padding: 10px 20px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            flex-shrink: 0;
            height: 65px;
        }
        .chat-header .back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px; }
        .chat-header .header-info { flex: 1; display: flex; flex-direction: column; }
        .chat-header h3 { font-size: 16px; font-weight: 600; color: #fff; }
        .chat-header .status { font-size: 12px; color: #4ade80; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
        .chat-header .status::before { content: ''; width: 6px; height: 6px; background: #4ade80; border-radius: 50%; display: inline-block; }

        /* 👈 لیست پیام‌ها با اسکرول خودکار */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            min-height: 0; /* 👈 کلید اسکرول */
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #0a0a0f;
            background-image: radial-gradient(rgba(139, 92, 246, 0.08) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* حباب پیام‌ها */
        .msg-bubble { 
            max-width: 80%; 
            padding: 10px 14px 24px 14px;
            border-radius: 16px; 
            font-size: 14px; 
            line-height: 1.6; 
            position: relative; 
            animation: popIn 0.2s ease-out; 
            word-wrap: break-word; 
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .msg-bubble.incoming { background: #1e1e2d; color: #e8edf5; align-self: flex-start; border-radius: 16px 16px 16px 4px; border: 1px solid rgba(255,255,255,0.03); }
        .msg-bubble.outgoing { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; align-self: flex-end; border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.15); }
        
        .msg-time { font-size: 10px; position: absolute; bottom: 4px; left: 8px; opacity: 0.7; }
        .msg-sender-name { font-size: 11px; color: #facc15; margin-bottom: 4px; font-weight: bold; display: block; }

        /* 👈 نوار ارسال چسبیده به پایین */
        .chat-input-area {
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); /* برای گوشی‌های ناچ‌دار */
            background: #111827;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0; 
            z-index: 10;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .chat-input-area input:focus { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05); }
        
        .chat-input-area button {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        .chat-input-area button:hover { transform: scale(1.05); }

        .empty-chat {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #8aa3c9; text-align: center; padding: 20px;
            background-image: radial-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .empty-chat i { font-size: 70px; color: rgba(139, 92, 246, 0.15); margin-bottom: 15px; }
        .empty-chat h3 { color: #c4b5fd; margin-bottom: 10px; font-size: 18px; }

        /* مودال ساخت گروه/کانال */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #161b22; border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; }
        .modal-box h3 { color: #c4b5fd; margin-bottom: 15px; font-size: 18px; text-align: center; }
        .modal-box label { display: block; color: #8aa3c9; font-size: 13px; margin-bottom: 6px; margin-top: 10px; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #e8edf5; font-size: 14px; outline: none; margin-bottom: 10px; font-family: inherit; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-cancel { background: rgba(255, 255, 255, 0.06); color: #8aa3c9; }
        .btn-confirm { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; }

        /* 👈 ریسپانسیو برای موبایل (کمتر از 768 پیکسل) */
        @media (max-width: 768px) {
            .sidebar { 
                width: 100%; 
                max-width: 100%;
                position: absolute; 
                height: 100%; 
                right: 0; 
            }
            .sidebar.hidden { right: -100%; }
            .chat-header .back-btn { display: block; }
            .msg-bubble { max-width: 85%; }
            .chat-area { width: 100vw; }
        }
    </style>
</head>
<body>

    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-users"></i>
            <h2>شبکه برنامه‌نویسان</h2>
            <button class="new-chat-btn" onclick="openCreateRoomModal()" title="ساخت گروه/کانال"><i class="fas fa-plus"></i></button>
            <a href="dashboard.html" class="back-home-btn"><i class="fas fa-home"></i></a>
        </div>
        
        <div class="sidebar-tabs">
            <button class="tab-btn active" id="tabChats" onclick="switchTab('chats')">💬 چت‌ها</button>
            <button class="tab-btn" id="tabUsers" onclick="switchTab('users')">👥 کاربران</button>
        </div>

        <div class="search-box" id="searchBox" style="display: none;">
            <input type="text" id="searchInput" placeholder="🔍 جستجوی برنامه‌نویس..." oninput="filterUsers()">
        </div>

        <div class="list-container" id="listContainer"></div>
    </div>

    <!-- بخش چت -->
    <div class="chat-area">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <button class="back-btn" onclick="showSidebar()"><i class="fas fa-arrow-right"></i></button>
            <div class="contact-avatar" style="width: 40px; height: 40px; font-size: 16px;" id="chatAvatar">👤</div>
            <div class="header-info">
                <h3 id="chatName">کاربر</h3>
                <span class="status" id="chatStatus">آنلاین</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat" id="emptyChat">
                <i class="fas fa-comments"></i>
                <h3>به شبکه برنامه‌نویسان خوش آمدید 🚀</h3>
                <p>از تب «کاربران» شروع کن یا یک گروه/کانال بساز!</p>
            </div>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- مودال ساخت گروه/کانال -->
    <div class="modal-overlay" id="createRoomModal">
        <div class="modal-box">
            <h3>🚀 ساخت گروه یا کانال</h3>
            <label>نوع:</label>
            <select id="roomType">
                <option value="group">👥 گروه (چت چند نفره)</option>
                <option value="channel">📢 کانال (فقط ادمین پیام می‌دهد)</option>
            </select>
            
            <label>نام:</label>
            <input type="text" id="roomName" placeholder="مثلاً: برنامه‌نویسان پایتون">
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateRoomModal()">انصراف</button>
                <button class="btn-confirm" onclick="createRoom()">ساخت</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="messenger.js"></script>
</body>
</html>
