<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت نام | نابغه‌کد</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#000;font-family:tahoma,sans-serif;color:#fff;padding:20px}
.card{width:100%;max-width:400px;padding:30px 20px;border-radius:20px;background:linear-gradient(145deg,#1a1a1a,#111);box-shadow:0 0 40px rgba(140,90,255,.15);text-align:center}
.title{font-size:24px;margin-bottom:12px}
.subtitle{font-size:12px;color:#aaa;line-height:1.9;margin:0 0 24px}
.form-group{text-align:right;margin-bottom:15px}
.input{display:block;width:100%;padding:14px;border:2px solid transparent;border-radius:14px;background:#ddd;color:#000;font-size:14px;outline:none;font-family:inherit}
.input:focus{border-color:#8b70ff}
.input.valid{border-color:#00c853}
.input.invalid{border-color:#ff3d00}
small{display:block;font-size:12px;margin-top:5px;color:#ff5252;min-height:15px}
.btn{width:100%;padding:14px;border:none;border-radius:16px;margin-top:15px;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#7a5cff,#6c8cff);font-family:inherit}
.btn:disabled{opacity:.6;cursor:not-allowed}
.footer{margin-top:20px;font-size:13px;color:#aaa}
.footer a{color:#9a7cff;text-decoration:none}
.hidden{display:none!important}
.code-input{direction:ltr;text-align:center;font-size:25px;letter-spacing:12px;font-weight:bold}
.back-btn{background:#333;margin-top:10px}
.message{font-size:12px;line-height:1.9;color:#aaa;margin-top:15px}
</style>
</head>
<body>

<div class="card">
    <div class="title">ثبت نام در نابغه‌کد</div>
    <p class="subtitle">برای ساخت حساب کاربری، اطلاعات خود را وارد کنید.</p>

    <form id="registerForm">
        <div id="informationStep">
            <div class="form-group">
                <input class="input" id="name" type="text" placeholder="نام کاربری" required maxlength="50">
                <small id="name-error"></small>
            </div>

            <div class="form-group">
                <input class="input" id="phone" type="tel" placeholder="شماره موبایل" required maxlength="11">
                <small id="phone-error"></small>
            </div>

            <div class="form-group">
                <input class="input" id="email" type="email" placeholder="آدرس ایمیل" required>
                <small id="email-error"></small>
            </div>

            <button class="btn" id="requestCodeBtn" type="submit">ارسال کد تأیید</button>
        </div>

        <div id="verificationStep" class="hidden">
            <p class="subtitle">
                کد تأیید به ایمیل شما ارسال شد.
                کد ۶ رقمی را وارد کنید.
            </p>

            <div class="form-group">
                <input class="input code-input" id="code" type="text"
                       inputmode="numeric" autocomplete="one-time-code"
                       placeholder="------" maxlength="6" required>
                <small id="code-error"></small>
            </div>

            <button class="btn" id="verifyCodeBtn" type="button">تأیید و ساخت حساب</button>
            <button class="btn back-btn" id="backBtn" type="button">بازگشت</button>

            <p class="message">
                کد تأیید ۵ دقیقه اعتبار دارد.
                این کد را در اختیار دیگران قرار ندهید.
            </p>
        </div>
    </form>

    <div class="footer">
        حساب کاربری داری؟
        <a href="login.html">وارد شو</a>
    </div>
</div>

<script src="api.js"></script>
<script src="register.js"></script>
<script src="debug.js"></script>

<script>
(function(){
    try{
        const session=localStorage.getItem("session");
        const loggedIn=localStorage.getItem("loggedIn");
        if(session||loggedIn==="true"){
            window.location.replace("ideas.html");
        }
    }catch(e){}
})();
</script>

</body>
</html>
