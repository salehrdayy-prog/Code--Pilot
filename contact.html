<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارتباط با ما</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">

    <style>
        body {
            background: #0f0f1a;
            color: #fff;
            font-family: sans-serif;
        }

        .contact-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background: #1a1a2e;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(124,77,255,0.4);
            text-align: center;
        }

        .contact-container h1 {
            margin-bottom: 10px;
        }

        .contact-container p {
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .contact-item {
            background: #111;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            transition: 0.3s;
        }

        .contact-item:hover {
            background: #222;
            transform: scale(1.03);
        }

        .contact-item a {
            color: #7c4dff;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-item span {
            display: block;
            font-size: 14px;
            opacity: 0.6;
        }

        .back-btn {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #7c4dff;
            border-radius: 10px;
            color: #7c4dff;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #7c4dff;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="contact-container">

    <h1>📞 ارتباط با ما</h1>

    </div>

    <!-- شماره -->
    <div class="contact-item">
        <span>شماره تماس</span>

    </div>

</div>

</body>
</html>
