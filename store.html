<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه | نابغه‌کد</title>
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #02030a; color: #e8edf5; min-height: 100vh; }

        .navbar {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .navbar .title { font-size: 20px; font-weight: 700; color: #d4dcec; display: flex; align-items: center; gap: 10px; }
        .navbar .title i { color: #8b5cf6; }
        .navbar .coins { background: rgba(139, 92, 246, 0.15); padding: 6px 14px; border-radius: 20px; color: #c4b5fd; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .store-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        /* ===== تب‌ها مثل روبیکا ===== */
        .tabs-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        .tabs-row::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8aa3c9;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn i { font-size: 14px; }
        .tab-btn:hover { background: rgba(139, 92, 246, 0.1); color: #c4b5fd; }
        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(124,58,237,0.2);
        }

        /* ===== بخش‌های محتوا ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 16px;
            color: #d4dcec;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: #8b5cf6; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            transition: 0.3s;
        }
        .card:hover {
            background: rgba(139, 92, 246, 0.06);
            border-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-4px);
        }

        .card .icon { font-size: 36px; display: block; margin-bottom: 8px; }
        .card h4 { font-size: 15px; color: #e8edf5; margin-bottom: 4px; }
        .card p { font-size: 12px; color: #8aa3c9; margin-bottom: 10px; }
        .card .price { font-weight: 700; color: #facc15; display: block; margin-bottom: 10px; }
        .card .badge { font-size: 11px; background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 2px 10px; border-radius: 12px; display: inline-block; margin-bottom: 8px; }

        .btn-buy {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-size: 13px;
        }
        .btn-buy:hover { transform: scale(0.96); }
        .btn-buy.owned { background: rgba(34, 197, 94, 0.2); color: #4ade80; cursor: default; }

        /* ===== کارت ویژه اشتراک ===== */
        .sub-card {
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(109,40,217,0.05));
            border: 1px solid rgba(139,92,246,0.2);
            border-radius: 16px;
            padding: 24px 20px;
            margin: 20px 0;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .sub-card:hover {
            background: rgba(139,92,246,0.15);
            transform: scale(1.01);
        }
        .sub-card h3 { color: #c4b5fd; font-size: 20px; margin-bottom: 6px; }
        .sub-card p { color: #8aa3c9; font-size: 14px; }
        .sub-card .btn-sub { margin-top: 12px; display: inline-block; background: #8b5cf6; color: #fff; padding: 10px 28px; border-radius: 12px; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .sub-card .btn-sub:hover { transform: scale(0.96); }

        /* ===== دکمه خرید سکه ===== */
        .buy-coins-btn {
            display: inline-block;
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.2);
            color: #facc15;
            padding: 10px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
        }
        .buy-coins-btn:hover {
            background: rgba(250, 204, 21, 0.25);
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="title"><i class="fas fa-store"></i> فروشگاه</span>
        <span class="coins" id="headerCoins"><i class="fas fa-coins"></i> ۰</span>
    </nav>

    <div class="store-container">

        <!-- ===== تب‌های دسته‌بندی ===== -->
        <div class="tabs-row">
            <button class="tab-btn active" data-tab="tab-themes"><i class="fas fa-palette"></i> قالب‌ها</button>
            <button class="tab-btn" data-tab="tab-badges"><i class="fas fa-medal"></i> نشان‌ها</button>
            <button class="tab-btn" data-tab="tab-boosters"><i class="fas fa-bolt"></i> تقویت‌کننده‌ها</button>
            <button class="tab-btn" data-tab="tab-exercises"><i class="fas fa-lock"></i> تمرین‌ها</button>
            <button class="tab-btn" data-tab="tab-ai"><i class="fas fa-robot"></i> هوش مصنوعی</button>
        </div>

        <!-- ===== کارت ویژه: اشتراک ===== -->
        <div class="sub-card" onclick="window.location.href='subscribe.html'">
            <h3>👑 اشتراک ویژه</h3>
            <p>دسترسی به تمام قابلیت‌ها، تمرین‌های پیشرفته و هوش مصنوعی</p>
            <a href="subscribe.html" class="btn-sub">مشاهده پلن‌ها</a>
        </div>

        <!-- ===== دکمه خرید سکه ===== -->
        <a href="buy-coins.html" class="buy-coins-btn">
            <i class="fas fa-coins"></i> خرید سکه
        </a>

        <!-- ===== محتوای تب‌ها ===== -->
        <div id="tab-themes" class="tab-content active">
            <h3 class="section-title"><i class="fas fa-palette"></i> قالب‌های رنگی</h3>
            <div class="grid" id="themesGrid"></div>
        </div>

        <div id="tab-badges" class="tab-content">
            <h3 class="section-title"><i class="fas fa-medal"></i> نشان‌های افتخار</h3>
            <div class="grid" id="badgesGrid"></div>
        </div>

        <div id="tab-boosters" class="tab-content">
            <h3 class="section-title"><i class="fas fa-bolt"></i> تقویت‌کننده‌ها</h3>
            <div class="grid" id="boostersGrid"></div>
        </div>

        <div id="tab-exercises" class="tab-content">
            <h3 class="section-title"><i class="fas fa-lock"></i> باز کردن تمرین‌ها</h3>
            <div class="grid" id="exercisesGrid"></div>
        </div>

        <div id="tab-ai" class="tab-content">
            <h3 class="section-title"><i class="fas fa-robot"></i> قابلیت‌های هوش مصنوعی</h3>
            <div class="grid" id="aiGrid"></div>
        </div>

    </div>

    <script src="store.js"></script>

    <script>
        // ===== سیستم تب‌ها =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // حذف active از همه تب‌ها
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                // فعال کردن تب کلیک شده
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        // ===== نمایش سکه در هدر =====
        function updateHeaderCoins() {
            const coins = parseInt(localStorage.getItem('userCoins')) || 0;
            const el = document.getElementById('headerCoins');
            if (el) el.innerHTML = `<i class="fas fa-coins"></i> ${coins}`;
        }
        updateHeaderCoins();
    </script>
<script src="api.js"></script>
</body>
</html>
